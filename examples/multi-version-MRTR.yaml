  elicitations:
  - name: choose_section
    mode: form
    message: Choose the tournament section for this entry.
    when: After eligibility is calculated for the supplied player.
    requestedSchema:
      type: object
      properties:
        section:
          type: string
          title: Tournament section
          oneOf:
          - const: open
            title: Open
          - const: u2000
            title: Under 2000
          - const: u1600
            title: Under 1600
      required:
      - section
    onDecline: The registration is not created.
    onCancel: The registration attempt is abandoned without creating an entry.
  interactionExamples:
    eligible-player:
      input:
        player_id: player-42
        tournament_id: spring-open-2026
      steps:
      - type: elicitation
        request:
          mode: form
          message: Choose the tournament section for this entry.
          requestedSchema:
