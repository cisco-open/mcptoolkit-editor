    title: Find Formats
    description: Explore high-level items on a Miro board. Returns a list of frames, documents, prototypes (interactive design mockups with multiple UI screens), individual prototype screens, tables, and diagrams with their URLs and titles. Use this to discover what's on a board before retrieving detailed content with context_get. Returns 'total' (item count) and, for large boards, a 'message' recommending that you retrieve context per item rather than requesting a whole-board context_get overview.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        items:
          description: List of all high-level board items
          items:
            description: High-level board item returned by context_explore.
            properties:
              miro_url:
                description: Full Miro URL to the item
                type: string
              title:
                description: Title or name of the item
                type: string
              type:
                description: "Item type: 'document' - rich text document, 'prototype' - interactive design prototype container with multiple screens, 'prototype_screen' - individual screen within a prototype containing HTML UI layout, 'frame' - container grouping related items, 'table' - data table, 'diagram' - flowchart, mind map, UML, or ER diagram"
                enum:
                  - document
                  - prototype_screen
                  - prototype
                  - frame
                  - table
                  - diagram
                type: string
              x:
                anyOf:
                  - type: number
                  - type: "null"
                default: null
                description: X-axis coordinate of the item on the board
              y:
                anyOf:
                  - type: number
                  - type: "null"
                default: null
                description: Y-axis coordinate of the item on the board
              parent_miro_url:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: Full Miro URL of parent item
            required:
