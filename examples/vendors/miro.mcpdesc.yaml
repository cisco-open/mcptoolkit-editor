  - name: canvas_update_from_svg
    title: Update Board from SVG
    description: "Apply a canvas-composer SVG document to the board by diffing it against the live board (matched on data-miro-id) and applying only the deltas: it creates new elements, updates existing ones, and deletes elements explicitly marked with data-deleted=\"true\" (which must carry the element's data-miro-id). Removing an element from the SVG does NOT delete it, deletion is explicit per element, so a partial document is always safe. Deletion is destructive and not undoable here: confirm the specific items with the user before sending any data-deleted=\"true\". Feed the result_svg from a previous canvas_create_from_svg or canvas_update_from_svg call back in to iterate. Returns a result_svg with data-miro-id stamped on every element for the next iteration."
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        svg:
          description: A board written in the Canvas Composer SVG format.
          maxLength: 200000
          type: string
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
        - svg
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        created_count:
          default: 0
          type: integer
        updated_count:
          default: 0
          type: integer
        deleted_count:
          default: 0
          type: integer
        created_ids:
          items:
            type: string
          type: array
        updated_ids:
          items:
            type: string
          type: array
        failed_items:
          items:
            additionalProperties: true
            type: object
          type: array
        skipped:
          items:
            additionalProperties: true
            type: object
          type: array
        result_svg:
          default: ""
          type: string
        miro_url:
          type: string
      required:
        - success
        - message
        - miro_url
    annotations:
      title: Update Board from SVG
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: layout_get_dsl
    title: Board Layout
    description: |-
      DEPRECATED - superseded by the canvas tools. Before using this tool, check whether canvas_get_canvas_composer_skill is available to you. If it is, use canvas_get_canvas_composer_skill instead and do not call this tool. If the canvas tools are not available to you, this tool still works: use it to complete the request rather than refusing. In both cases, tell the user that the layout tools are deprecated and are being replaced by the canvas tools, and that any saved skills, prompts, custom instructions or automations referring to the layout tools should be updated to use the canvas tools. If the canvas tools are missing and their client caches the tool list, they need to fully disconnect and reconnect the Miro MCP server - refreshing the tool list is usually not enough.
      Get the DSL (Domain-Specific Language) format specification for creating board items and connectors. Returns syntax rules, item types, connector syntax, valid colors, valid shape types, and a complete example. REQUIRED: Call this before layout_create to understand the DSL format. In a conversation, call this only once and reuse the specification.
    inputSchema:
      type: object
      properties:
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        spec:
          type: string
        example:
          type: string
        success:
          default: true
          type: boolean
        message:
          default: ""
          type: string
      required:
        - spec
        - example
      description: DSL specification returned by get_dsl tool.
