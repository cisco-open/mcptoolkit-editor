  - name: prototype_read
    title: Read Prototype Screens
    description: "Read prototype screens from a Miro board. Returns prototype screens with metadata (position, dimensions, device type) and HTML markup representing each screen's UI layout. Useful for AI tools to understand the design, structure, and navigation flow of interactive prototypes. Provide screen_id to read a specific screen, or omit to list all screens on the board. Recommended workflow: first list all screens with include_html=false (default) to get metadata, then read a specific screen with include_html=true to get its HTML markup."
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        screen_id:
          default: null
          description: Widget ID of a specific prototype screen to read. When omitted, all prototype screens on the board are returned.
          type: string
          nullable: true
        include_html:
          default: false
          description: Whether to include HTML markup for each screen. Defaults to false. Set to true only when HTML is needed for a specific screen to avoid large context payloads.
          type: boolean
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        screens:
          description: List of prototype screens with their content
          items:
            description: Information about a single prototype screen.
            properties:
              id:
                description: Widget ID of the prototype screen
                type: string
              name:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: Screen name or title
              miro_url:
                description: Miro URL to navigate to this screen
                type: string
              device_type:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: Target device type (mobile, tablet, desktop)
              device_orientation:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: Device orientation (portrait, landscape)
              x:
                default: 0
                description: X-axis position on the board
                type: number
              y:
                default: 0
                description: Y-axis position on the board
                type: number
              width:
                default: 0
                description: Screen width in pixels
                type: number
              height:
                default: 0
                description: Screen height in pixels
                type: number
              html:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: HTML markup representing the UI layout of this screen
              summary:
                description: Structural summary of the screen layout
                properties:
                  sections:
                    description: Semantic sections (header, nav, main, footer, etc.)
                    items:
                      type: string
                    type: array
                  components:
                    description: UI components detected (button, card, modal, etc.)
                    items:
                      type: string
                    type: array
                  interactive_elements:
                    description: Interactive elements (buttons, inputs, links, etc.)
                    items:
                      type: string
                    type: array
                type: object
              connectors:
                description: Navigation connectors leading from this screen to other screens
                items:
                  description: Navigation connector between prototype screens.
                  properties:
                    source_widget_id:
                      description: Widget ID of the source interactive element
                      type: string
                    target_screen_id:
                      description: Widget ID of the target screen
                      type: string
                  required:
                    - source_widget_id
                    - target_screen_id
                  type: object
                type: array
            required:
              - id
              - miro_url
            type: object
          type: array
        total_screens:
          description: Total number of prototype screens found
          type: integer
      required:
        - screens
        - total_screens
      description: Response from prototype_read tool.
    annotations:
      title: Read Prototype Screens
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: prototype_get_upload_url
    title: Get HTML Upload URL
    description: |-
      Reserve one or more single-use upload slots for HTML screens. Set count to the number of screens in the prototype to reserve all slots in a single call instead of calling this once per screen. Returns one entry per slot, each with its own upload_url and token; uploads can run in parallel.
      PUT the raw HTML as the request body with Content-Type: text/html; no auth header.
      curl: curl -X PUT -H 'Content-Type: text/html' --data-binary @page.html '<upload_url>'. If the HTML only exists as a string in your context, write it to a local file first (e.g. page.html), then PUT that file — not already having a file is not a reason to fall back to html_contents.
      Max size: 1,048,576 bytes per screen. External http/https image URLs are fine; the server fetches them. Only local file references need pre-upload (see prototype_create's image_tokens).
      After each upload, pass its token to prototype_create, in the same order.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        count:
          default: 1
          description: Number of upload slots to reserve, one per screen. Request all slots needed for a prototype in a single call so uploads can run in parallel.
          maximum: 20
          minimum: 1
          type: integer
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        result:
          items:
            description: Response from prototype_get_upload_url — presigned S3 PUT URL and a single-use token.
            properties:
              upload_url:
                description: "Upload endpoint URL. Send the HTML file as the raw request body. Set Content-Type: text/html. No Authorization header needed. curl usage: curl -X PUT -H 'Content-Type: text/html' --data-binary @page.html '<url>'."
                type: string
              token:
                description: Single-use token to pass to prototype_create after the upload completes.
                type: string
              expires_in:
                description: Seconds until this URL expires
                type: integer
            required:
              - upload_url
              - token
              - expires_in
            type: object
          type: array
      required:
        - result
      x-fastmcp-wrap-result: true
    annotations:
      title: Get HTML Upload URL
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: prototype_create
    title: Create Prototype
    description: |-
      Create a Miro prototype from one or more HTML screens.

      Images: leave external http/https URLs in the HTML untouched — the server fetches and uploads them for you. ONLY local file references (e.g. './logo.png', 'assets/x.svg') need pre-upload: call image_get_upload_url with src set to the EXACT in-HTML reference, PUT the bytes, then pass the returned tokens via image_tokens below. The server rewrites matching <img src=...> attributes and attaches data-board-resource — do NOT rewrite the HTML yourself.
      IMPORTANT: ONLY local file references (e.g. './logo.png', 'assets/x.svg') in any part of the HTML like inline, url(), srcset, etc... REQUIRES pre-upload: call image_get_upload_url with src set to the EXACT in-HTML reference, PUT the bytes, then pass the returned tokens via image_tokens below.
      Fonts: CDN URL only.
      Author static HTML + CSS only — <script> elements and inline event handlers (onclick etc.) are stripped, so any scripted behavior is silently lost; use CSS states (:hover, :focus) for visual interactivity.
      Max per screen: 1,048,576 bytes. Max screens per call: 20 — split larger prototypes across multiple prototype_create calls.

      Provide exactly one input — PREFER html_tokens (HTML stays out of context). html_contents is a last-resort fallback only when the runtime cannot issue an HTTP PUT at all; HTML size, image count, multi-screen, or not yet having the HTML saved to a file are NOT valid reasons — write it to a file yourself, then PUT it.

      Placement: no item target → x/y are board-absolute (center is (0, 0)); moveToWidget on a frame → prototype is created inside, x/y are relative to frame top-left and must fit within frame width/height. All screens in one call share device_type, orientation, and placement; order is preserved.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        html_tokens:
          default: null
          description: Preferred input. Ordered list of tokens from prototype_get_upload_url, one per screen. Use whenever the runtime can issue an HTTP PUT. Max 20 tokens per call.
          items:
            type: string
          maxItems: 20
          minItems: 1
          type: array
          nullable: true
        html_contents:
          default: null
          description: Last-resort fallback. Use ONLY when the runtime cannot issue an HTTP PUT at all (sandboxed agent with no network/curl/fetch). HTML size, image count, multi-screen, or not yet having the HTML saved to a file are NOT valid reasons — write the HTML to a file yourself and PUT it; html_tokens handles size/complexity by keeping the HTML out of context. Ordered list of raw HTML strings, one per screen; each at most 1,048,576 bytes. Max 20 screens per call.
          items:
            type: string
          maxItems: 20
          minItems: 1
          type: array
          nullable: true
        image_tokens:
          default: null
          description: "REQUIRED whenever the HTML references images by a non-http(s) path (e.g. './logo.png', 'assets/x.svg', '/var/...'). Omitting tokens for such refs leaves broken images. External http/https URLs are fetched server-side and do NOT belong here. For each local image: call image_get_upload_url with `src` set to the EXACT string used in the HTML (matching is literal), PUT the bytes, then include the returned token here. The server rewrites every <img src=...> matching the stored src and attaches data-board-resource — do NOT rewrite the HTML yourself. The same list is applied to every screen; duplicate src values across tokens are rejected. May be omitted only when the HTML has zero local image refs."
          items:
            type: string
          type: array
          nullable: true
        device_type:
          default: desktop
          description: "Target device type for the prototype. Applies to every screen. Accepted values: 'desktop' (default), 'mobile', or 'tablet'."
          enum:
            - desktop
            - mobile
            - tablet
          type: string
        orientation:
          default: landscape
          description: "Screen orientation for the prototype. Applies to every screen. Accepted values: 'landscape' (default) or 'portrait'."
          enum:
            - landscape
            - portrait
          type: string
        x:
          default: null
          description: "X-axis coordinate. Without a frame target: board-absolute, board center is x=0. With a frame target via moveToWidget: relative to the frame's top-left corner (frame top-left is x=0)."
          type: number
          nullable: true
        y:
          default: null
          description: "Y-axis coordinate. Without a frame target: board-absolute, board center is y=0. With a frame target via moveToWidget: relative to the frame's top-left corner (frame top-left is y=0)."
          type: number
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        miro_url:
          type: string
        success:
          type: boolean
        message:
          type: string
        x:
          anyOf:
            - type: number
            - type: "null"
          default: null
        y:
          anyOf:
            - type: number
            - type: "null"
          default: null
        parent_miro_url:
          anyOf:
            - type: string
            - type: "null"
          default: null
        successful_image_count:
          default: 0
          description: Number of image refs successfully uploaded to board resources during HTML processing. Pairs with failed_image_count to give the agent the full picture.
          type: integer
        failed_image_count:
          default: 0
          description: Number of image refs that could not be uploaded during HTML processing and were stripped from the prototype HTML.
          type: integer
        failed_image_reason:
          anyOf:
            - type: string
            - type: "null"
          default: null
          description: Representative reason for image upload failures when failed_image_count > 0 (e.g. validation rejection or platform error). Null when no images failed.
      required:
        - miro_url
        - success
        - message
      description: Response model for prototype creation.
    annotations:
      title: Create Prototype
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
