  - name: table_create
    title: Create Table
    description: "Create a table on a Miro board with specified columns. Supports text, select, multiselect, date, link, person, and number column types. This always creates a plain grid table. To produce a timeline, kanban, or tree, first create the table here, then call table_update_view to switch its layout. For a request like 'create a timeline/kanban/tree', do BOTH steps in sequence. Coordinates: when the URL has no item target, x/y are board-absolute (board center is (0, 0)). When the URL targets a frame via moveToWidget, the table is created INSIDE that frame and x/y are relative to the frame's top-left corner; (0, 0) is the frame's top-left and the table must fit within the frame's width and height. If no board URL is provided, a new board will be created. IMPORTANT: Always confirm with the user before creating a new board."
    inputSchema:
      type: object
      properties:
        table_title:
          description: The title/name of the table
          maxLength: 255
          minLength: 1
          type: string
        columns:
          description: |-
            List of columns to create. At least one column must be provided.

                        Column types:
                        1. Text columns: Simple text fields

                        2. Select columns: Dropdown menus with predefined options, single value per row
                           - Each option needs a displayValue and color (hex code)

                        3. Multiselect columns: Like select, but a row can hold multiple options
                           - Each option needs a displayValue and color (hex code)

                        4. Date columns: Date/time values in ISO 8601 format

                        5. Link columns: URLs with optional display text

                        6. Person columns: Assign Miro users by their user ID

                        7. Number columns: Numeric values with configurable decimal places
                           - Optional "decimals" (int, default 0) sets displayed decimal places

                        Examples:
                        [
                          {"column_type": "text", "column_title": "Name", "isTitle": true},
                          {"column_type": "text", "column_title": "Description"},
                          {"column_type": "date", "column_title": "Due Date"},
                          {"column_type": "link", "column_title": "Reference"},
                          {"column_type": "person", "column_title": "Assignee"},
                          {"column_type": "number", "column_title": "Estimate", "decimals": 1},
                          {
                            "column_type": "select",
                            "column_title": "Status",
                            "options": [
                              {"displayValue": "To Do", "color": "#FF0000"},
                              {"displayValue": "In Progress", "color": "#FFA500"},
                              {"displayValue": "Done", "color": "#00FF00"}
                            ]
                          },
                          {
                            "column_type": "multiselect",
                            "column_title": "Tags",
                            "options": [
                              {"displayValue": "Frontend", "color": "#FF0000"},
                              {"displayValue": "Backend", "color": "#FFA500"}
                            ]
                          }
                        ]
          items:
            oneOf:
              - description: Input specification for a text column.
                properties:
                  column_type:
                    const: text
                    default: text
                    type: string
                  column_title:
                    description: Column name (e.g., 'Title', 'Description', 'Notes')
                    maxLength: 255
                    minLength: 1
                    type: string
                  isTitle:
                    default: false
                    description: Set true to make this the table's primary title column. Every table has exactly one, and it cannot be deleted. Mark the most identifying text column (a name or short summary). If no text column is marked, the first text column is used; if there is no text column, a 'Title' column is added automatically.
                    type: boolean
                required:
                  - column_title
                  - column_type
                type: object
              - description: Input specification for a select column.
                properties:
                  column_type:
                    const: select
                    default: select
                    type: string
                  column_title:
                    description: Column name (e.g., 'Status', 'Priority')
                    maxLength: 255
                    minLength: 1
                    type: string
                  options:
                    description: List of options for the select dropdown
                    items:
                      description: Input for select column option.
                      properties:
                        displayValue:
                          description: Display text for this option (e.g., 'To Do', 'In Progress', 'Done')
                          maxLength: 100
                          minLength: 1
                          type: string
                        color:
                          description: Hex color code for this option (e.g., '#FF0000' for red, '#00FF00' for green)
                          pattern: ^#[0-9A-Fa-f]{6}$
                          type: string
                      required:
                        - displayValue
                        - color
                      type: object
                    maxItems: 50
                    minItems: 1
                    type: array
                required:
                  - column_title
                  - options
                  - column_type
                type: object
              - description: Input specification for a multiselect column.
                properties:
                  column_type:
                    const: multiselect
                    default: multiselect
                    type: string
                  column_title:
                    description: Column name (e.g., 'Tags', 'Labels')
                    maxLength: 255
                    minLength: 1
                    type: string
                  options:
                    description: List of options for the multiselect dropdown
                    items:
                      description: Input for select column option.
                      properties:
                        displayValue:
                          description: Display text for this option (e.g., 'To Do', 'In Progress', 'Done')
                          maxLength: 100
                          minLength: 1
                          type: string
                        color:
                          description: Hex color code for this option (e.g., '#FF0000' for red, '#00FF00' for green)
                          pattern: ^#[0-9A-Fa-f]{6}$
                          type: string
                      required:
                        - displayValue
                        - color
                      type: object
                    maxItems: 50
                    minItems: 1
                    type: array
                required:
                  - column_title
                  - options
                  - column_type
                type: object
              - description: Input specification for a date column.
                properties:
                  column_type:
                    const: date
                    default: date
                    type: string
                  column_title:
                    description: Column name (e.g., 'Due Date', 'Start Date')
                    maxLength: 255
                    minLength: 1
                    type: string
                required:
                  - column_title
                  - column_type
                type: object
              - description: Input specification for a link column.
                properties:
                  column_type:
                    const: link
                    default: link
                    type: string
                  column_title:
                    description: Column name (e.g., 'Reference', 'Source URL')
                    maxLength: 255
                    minLength: 1
                    type: string
                required:
                  - column_title
                  - column_type
                type: object
              - description: Input specification for a person column.
                properties:
                  column_type:
                    const: person
                    default: person
                    type: string
                  column_title:
                    description: Column name (e.g., 'Assignee', 'Owner')
                    maxLength: 255
                    minLength: 1
                    type: string
                required:
                  - column_title
                  - column_type
                type: object
              - description: Input specification for a number column.
                properties:
                  column_type:
                    const: number
                    default: number
                    type: string
                  column_title:
                    description: Column name (e.g., 'Estimate', 'Quantity', 'Price')
                    maxLength: 255
                    minLength: 1
                    type: string
                  decimals:
                    default: 0
                    description: Number of decimal places to display
                    maximum: 10
                    minimum: 0
                    type: integer
                required:
                  - column_title
                  - column_type
                type: object
          maxItems: 50
          minItems: 1
          type: array
        x:
          default: null
          description: "X-axis coordinate for table placement. Without a frame target: board-absolute, board center is x=0. With a frame target via moveToWidget: relative to the frame's top-left corner (frame top-left is x=0). Use different x values to prevent overlap when creating multiple items."
          type: number
          nullable: true
        y:
          default: null
          description: "Y-axis coordinate for table placement. Without a frame target: board-absolute, board center is y=0. With a frame target via moveToWidget: relative to the frame's top-left corner (frame top-left is y=0). Use different y values to prevent overlap when creating multiple items."
          type: number
          nullable: true
        miro_url:
          default: null
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). If not provided, a new board will be created (requires user confirmation). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - table_title
        - columns
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    annotations:
      title: Create Table
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: table_list_rows
    title: Read Table
    description: |-
      Get rows from a Miro table with column metadata. Each row includes a stable rowId that uniquely identifies it within the table. rowIds persist across sorting, insertion, and deletion — use them to target specific rows in table_sync_rows. Supports filtering by column value. Returns text, select, multiselect, and latest_update columns.

      Best practice: always use filter_by and limit when possible.Examples: next item that is not done: {"filter_by": {"Status":["To do", "In progress"]}, "limit": 1}top 5 high priority tasks: {"filter_by": {"Priority":["High"]}, "limit": 5}

      Response includes for each row: rowId (stable row identifier), cells (array of columnTitle, valueType, content, options, latest_update_text, latest_update_author_id).

      Pagination: Use 'limit' to control page size (default 10) and 'next_cursor' to fetch subsequent pages. The cursor is opaque and encodes pagination state.

      IMPORTANT: Do not change 'filter_by' when using a cursor from a previous response, as this will result in an error. To apply a different filter, start a new pagination sequence (no cursor).
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro URL to a specific item (e.g., 'https://miro.com/app/board/uXjVOakxTk0=/?moveToWidget=3458764516062720430'). Must include moveToWidget or focusWidget query parameter.
          minLength: 1
          type: string
        filter_by:
          default: null
          description: "Filter rows by column value(s) in JSON format (case-insensitive). Only select and multiselect columns are supported. Format: JSON object mapping column names to arrays of display values. Example: {\"Status\": [\"In Progress\", \"Done\"]} matches rows where Status is either 'In Progress' OR 'Done'"
          type: string
          nullable: true
        next_cursor:
          default: null
          description: Pagination cursor for the next set of results
          type: string
          nullable: true
        limit:
          default: null
          description: Maximum rows to return (minimum 1)
          minimum: 1
          type: integer
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro URL to the table
          type: string
        columns:
          anyOf:
            - items:
                description: Information about a created table column.
                properties:
                  id:
                    description: Unique identifier of the column
                    type: string
                  column_title:
                    description: Display title of the column
                    type: string
                  column_type:
                    description: "Column type: 'text', 'select', 'multiselect', 'date', 'link', 'person', or 'number'"
                    type: string
                  selectOptions:
                    anyOf:
                      - items:
                          description: Option for select-type columns (response).
                          properties:
                            id:
                              description: Unique identifier of the select option
                              type: string
                            displayValue:
                              description: Display text for this option
                              type: string
                            color:
                              description: Color code for this option
                              type: string
                          required:
                            - id
                            - displayValue
                            - color
                          type: object
                        type: array
                      - type: "null"
                    default: null
                    description: Available options (only for select/multiselect columns)
                required:
                  - id
                  - column_title
                  - column_type
                type: object
              type: array
            - type: "null"
          default: null
          description: Column metadata including titles, types, and select options
        rows:
          description: Array of table rows
          items:
            description: Single table row.
            properties:
              rowId:
                description: Unique identifier of the row
                type: string
              cells:
                description: Array of cells in this row
                items:
                  additionalProperties: true
                  type: object
                type: array
            required:
              - rowId
              - cells
            type: object
          type: array
        total:
          description: Total number of rows matching the filter (before pagination)
          type: integer
        cursor:
          anyOf:
            - type: string
            - type: "null"
          default: null
          description: Pagination cursor for the next page of results
      required:
        - miro_url
        - rows
        - total
      description: Response from list_rows tool.
    annotations:
      title: Read Table
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: table_get_latest_update_history
    title: Read Latest Update History
    description: |-
      Get the history of a row's Latest Update field. The Latest Update field accumulates the text updates submitted for that row over time; this returns those entries ordered chronologically. Provide the table via its Miro URL and the target row via rowId (get rowIds from table_list_rows).

      Response includes for each entry: text, author_id (Miro user ID of the author), created_at and modified_at (ISO 8601 timestamps), plus the total number of entries.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro URL to a specific item (e.g., 'https://miro.com/app/board/uXjVOakxTk0=/?moveToWidget=3458764516062720430'). Must include moveToWidget or focusWidget query parameter.
          minLength: 1
          type: string
        row_id:
          description: Stable identifier of the row whose Latest Update field history to fetch. Get rowIds from table_list_rows.
          pattern: ^[0-9a-zA-Z_-]{1,64}$
          type: string
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
