          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - content_item_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        entries:
          description: Subjects with access, one entry per role assignment
          items:
            additionalProperties: true
            type: object
          type: array
        nextCursor:
