  - name: canvas_get_canvas_composer_skill
    title: Canvas Composer
    description: "Get the DSL (Domain-Specific Language) format specification for creating board items. Returns syntax rules, item types, valid colors, valid shape types, and a complete example. REQUIRED and FIRST: call this before canvas_create_from_svg, and before canvas_load_format_skill, to learn the SVG board format. This is the foundational skill -- every use-case skill from canvas_load_format_skill (e.g. diagramming) layers on top of it and assumes you already have it, so never load a format skill before this one. In a conversation, call this only once and reuse the specification."
    inputSchema:
      type: object
      properties:
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        skill:
          default: |+

            # Canvas Composer DSL Specification

            The following is a specification on how to interact with a Miro board using a bespoke DSL and board-editing protocol.
            The DSL is a subset of the SVG format, but with some additional constraints and features. Each svg component maps to a widget in the miro board.

            ## 1. The SVG board format

            The payload is a single <svg> root element; each <g> directly inside it is one complete module (one frame). Wrap every module in that one <svg>...</svg> root, even when there is only one.

            Widget forms and positioning:
            + Basic widgets use native SVG positioning: `<rect>`, `<image>`, and `<textArea>` x/y are top-left; `<circle>` and `<ellipse>` cx/cy are their center; `<polygon>` uses points; `<text>` x is its anchor and y its baseline; `<line>` uses two endpoints; a frame's translate is its top-left origin.
            + Custom widgets use a `<rect data-type="custom-widget" data-widget-type="NAME">` placeholder and must not be drawn manually. Their x/y are top-left; width/height are optional. Use the natural size below and do not stretch it.
            + Structured widgets use a `<foreignObject>` with the widget's `data-type`. Their x/y are top-left; an untyped `<foreignObject>` is rejected.

            ### 2. WIDGETS

            #### BASIC WIDGETS

            ##### CONNECTOR
            A relationship between two widgets that stays attached as they move.

            - Every connector requires data-start and data-end references to local widget ids.
            - x1 and y1 are the start point; x2 and y2 are the end point.
            - Reference actual widgets, never frames or other connectors.
            - For truly free-floating lines, use r=4 endpoint circles filled with the line color and no stroke; never use them as fake anchors on widgets.
            - Connect each relationship directly; do not draw shared backbones or lines through widgets.
            - Avoid crossing frame boundaries unless the user requests it.
            - Connectors may loop or share endpoints.
            - Give parallel connectors between the same widgets distinct labels.
            - Keep stroke-width between 1 and 4 unless the design requires otherwise.
            - Use data-arrow for arrowheads; do not draw arrowhead shapes.
            - Pin data-start-side and data-end-side (top/right/bottom/left) so links do not cross other widgets; e.g. a left-to-right tree uses start right, end left. Omit for auto.
            - Connectors linking labeled nodes into a diagram (mind map, org chart, concept map) mean you are hand-assembling a diagram: call canvas_load_format_skill(format_name="diagramming", notation="free_form") before create_from_svg for its palette, borders, shapes, and routing.

            + `data-start`: Local id of the start widget.
            + `data-end`: Local id of the end widget.
            + `stroke`: Line color.
            + `stroke-width`: Line thickness in pixels.
            + `data-arrow` (start|end|both): Arrowhead placement.
            + `stroke-dasharray`: Use 5,5 for dashed or 2,2 for dotted.
            + `data-shape` (straight|curved|elbowed): Routing style: prefer elbowed for tree and flow diagrams, straight for short direct links; use curved only for a deliberately organic look, never by default.
            + `data-start-side` (top|right|bottom|left): Side of the start widget to attach to (top/right/bottom/left); omit for auto.
            + `data-end-side` (top|right|bottom|left): Side of the end widget to attach to (top/right/bottom/left); omit for auto.
            + `data-content`: Short relationship label.

            ```xml
            <line id="link" x1="300" y1="200" x2="500" y2="200" stroke="#1a1a1a" stroke-width="2" data-arrow="end" data-start="source" data-end="target" data-content="approved" />
            ```

            ##### FRAME
            A titled container that groups a board section and owns its child layout.

            - Author a g with translate(x,y); every child coordinate is relative to that origin.
            - The first child must be a rect with data-type=frame at x=0 and y=0.
            - Put data-frame on the g and fill on the background rect.
            - On an update, only a non-empty data-frame changes the title.
            - Frames do not accept border strokes or border radius. The only styling parameter is the background color through `fill` parameter. For a transparent background use `fill=#ffffffff` (a thin border will exist).
            - `width` and `height` are fully respected on the canvas.
            - If a frame hosts a sticky dropping area, it should leave plenty of empty space. Ideally, several times the size of a single sticky.
            - If a `frame-title` is given it sits right above top left corner of the frame. Do not include any other title or element in that region.

            + `data-frame`; alias: `data-title`: Frame title.
            + `fill`: Background color on the frame rect.

            ```xml

            <g id="section" transform="translate(100,100)" data-frame="Research">
                <rect data-type="frame" x="0" y="0" width="1200" height="800" fill="#ffffff" data-title="Research" />
                ...
            </g>

            ```

            ##### HTML_CONTENT
            An HTML slide, embed, or prototype screen containing one sealed HTML document.

            - The widget is a `<g data-type="html_content">` container. Put the HTML document in one `<html-source><![CDATA[ ... ]]></html-source>` child; it renders as-is and is never decomposed into elements.
            - `data-kind` is `prototype`, `slide`, or `embed`; fixed at creation and cannot change on update.
            - For `slide`/`embed`: position with `transform="translate(x,y)"`; size with `data-scale` (box is 1280*scale by 720*scale), top-left anchored.
            - For `prototype`: omit `transform` and `data-scale`; its prototyping container owns position and size.
            - Replacing `<html-source>` replaces the HTML document; read-back omits it, so resend it only when changing it.
            - HTML body is capped at 1,048,576 bytes UTF-8.

            + `data-kind` (prototype|slide|embed): Widget kind, fixed at creation: prototype, slide, or embed.
            + `data-title`: Widget title.
            + `data-scale`: Render scale; the box is 1280*scale by 720*scale.

            ```xml
            <!-- prototype screen (container-managed position and size) -->
            <g data-type="html_content" data-kind="prototype" data-title="Home">
              <html-source><![CDATA[<section><h1>Home</h1></section>]]></html-source>
            </g>

            <!-- slide (scale + transform) -->
            <g data-type="html_content" data-kind="slide" data-title="Title" data-scale="1" transform="translate(100,100)">
              <html-source><![CDATA[<section><h1>Title</h1></section>]]></html-source>
            </g>
            ```

            ##### IMAGE
            An image from a reachable URL for photos, illustrations, and visual assets.

            - The board preserves the source aspect ratio, so provided height may be adjusted.
            - Images served from the local /images/ path are available during development.

            + `href`; alias: `xlink:href`: Public image URL.

            ```xml
            <image id="photo" data-type="image" href="https://example.com/photo.png" x="100" y="100" width="640" height="360" />
            ```

            ##### SHAPE
            A geometric object for labeled nodes, backgrounds, regions, and decoration.

            - Author rect, circle, ellipse, or polygon; data-shape selects another supported shape.
            - Use data-content for centered labels and standalone text for freely placed copy.
            - The rx value is an exact, non-scaling pixel radius; use 12 for soft corners or 62 for a pill-like shape, and omit it for sharp corners.
            - Keep both dimensions at least 8 pixels. Smaller dimensions grow to 8 around the same center; use a connector for a thin line.
            - `data-content` accepts rich formatting via html tags: `<b>` `<i> <u>` `<em>` `<strong>` `<s>` `<sub>` `<sup>` `<br>`

            When richer content is needed instead of a simple label a rect can act as a panel or card:
            ```xml
            <-- A rect with multiline content -->
            <rect x="835" y="262" width="400" height="150" rx="6" fill="#FFD9C7"/>
            <circle cx="871" cy="298" r="18" fill="#F2704B"/>
            <text x="871" y="304" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
            <text x="901" y="304" font-family="sans-serif" font-size="16" font-weight="600" fill="#6B2F11">Weekly customer feedback call</text>
            <text x="901" y="332" font-family="sans-serif" font-size="13" fill="#8A5033">why now: churn signals are unclear</text>
            ```

            + `data-content`: Centered shape label.
            + `data-shape` (can|circle|cloud|cross|flow_chart_predefined_process|hexagon|left_arrow|left_brace|left_right_arrow|octagon|parallelogram|pentagon|rectangle|rhombus|right_arrow|right_brace|round_rectangle|star|trapezoid|triangle|wedge_round_rectangle_callout): Explicit board shape; otherwise inferred from the SVG tag.
            + `rx`: Exact corner radius in pixels for rects.
            + `fill`: Shape fill color.
            + `data-text-color`: Label text color.
            + `data-font-family` (abril_fatface|arial|bangers|caveat|eb_garamond|formular|fredoka_one|georgia|graduate|gravitas_one|lemon_tuesday|nixie_one|noto_sans|open_sans|permanent_marker|plex_mono|plex_sans|plex_serif|pt_sans|pt_sans_narrow|pt_serif|rammetto_one|roboto|roboto_condensed|roboto_mono|roboto_slab|spoof|tiempos_text|times_new_roman|titan_one); alias: `font-family`: Label font family.
            + `data-font-size`: Label font size in pixels.
            + `data-font-weight` (normal|bold|bolder|400|600|700|800|900): Use bold for a bold label.
            + `stroke`: Border color; use none for no visible border.
            + `stroke-dasharray`: Use 5,5 for a dashed or 2,2 for a dotted border; none resets to solid.
            + `stroke-width`: Border thickness in pixels, greater than 1.

            ```xml
            <!-- A rect with embedded content -->

            <rect id="proj" x="0" y="0" width="300" height="100" rx="12" fill="#2D3142" stroke="none" data-content="THIS PROJECT" data-text-color="#FFFFFF" data-font-size="14" data-font-weight="bold" />


            <!-- A rect as a placeholder -->

            <rect x="100" width="100" height="150" rx="6" fill="#FCFBF6" stroke="#CFC9BA" stroke-width="2" stroke-dasharray="5,5"/>

            ```

            ##### STICKY
            A lightweight note for spatial thinking, clustering, and short ideas.

            - Use a 199x228 box for a square sticky or 350x228 for a wide sticky.
            - For other sizes, keep square height near width x 1.15 or wide height near width x 0.65.
            - A width-to-height ratio above about 1.16 selects wide; otherwise it selects square.
            - The board fits and centers that fixed shape inside the authored box, so avoid flat or stretched boxes.
            - Stickies accept data-rotation but do not visually rotate.
            - Often, when a group of stickies exist, perfect alignment is not desirable. Instead rough positioning makes it look more realistic.
            - When a region it's supposed to be used to drop stickies by the users, leave ample empty spaces to suggest dropping areas. If a sticky dropping area is intended, the container should be as big as several times the size of a sticky
            - `data-content` accepts rich formatting via html tags: `<b>` `<i> <u>` `<em>` `<strong>` `<s>` `<sub>` `<sup>` `<br>`

            + `data-content`: Note text.
            + `data-color` (black|blue|cyan|dark_blue|dark_green|gray|green|light_blue|light_green|light_pink|light_yellow|orange|pink|red|violet|yellow): Named sticky color, not a hex value.

            ```xml
            <rect id="note" data-type="sticky" x="100" y="100" width="199" height="228" data-color="yellow" data-content="Customer insight" />
            ```

            ##### TEXT
            Flowing paragraphs, headers, labels, and freely positioned copy.

            - Use textArea for paragraphs and multiline text; width controls wrapping.
            - A textArea's height is optional and grows with its content.
            - Use text only for a short standalone heading or label; it does not wrap.
            - Do not overlay text on a labeled shape or sticky; put the label in data-content.
            - A textArea body supports `<b>`, `<i>`, `<u>`, `<s>`, `<strong>`, `<em>`, `<a href="...">`, and `<br/>`.
            - Source whitespace collapses, so use `<br/>` for explicit line breaks and one textArea per logical block.
            - A textArea uses top-left x and y. A text uses baseline y, with x at the start, middle, or end selected by text-anchor.
            - Delete a text widget to remove it; an empty body on update preserves its content.

            + element body: Text content.
            + `fill`: Text color.
            + `font-family` (abril_fatface|arial|bangers|caveat|eb_garamond|formular|fredoka_one|georgia|graduate|gravitas_one|lemon_tuesday|nixie_one|noto_sans|open_sans|permanent_marker|plex_mono|plex_sans|plex_serif|pt_sans|pt_sans_narrow|pt_serif|rammetto_one|roboto|roboto_condensed|roboto_mono|roboto_slab|spoof|tiempos_text|times_new_roman|titan_one); alias: `data-font-family`: Font family.
            + `font-size`: Font size in pixels.
            + `text-align` (left|center|right): Flowing text alignment.
            + `text-anchor` (start|middle|end): Horizontal anchor relative to x.
            + `font-weight` (normal|bold|bolder|400|600|700|800|900): Use bold for bold text.

            ```xml
            <textArea id="summary" x="100" y="100" width="600" font-size="24"><b>Overview</b><br/>First point</textArea>
            ```

            #### CUSTOM WIDGETS

            ##### ACTION_BUTTON
            A facilitation button that starts a board action.

            - For countdown, use data-duration as MM:SS or plain minutes; default is 05:00.

            + natural size: 232x124
            + `data-action` (aws_cost_calculator|aws_icons|board_recording|breakout_rooms|countdown|dependencies|estimation|import_diagram_app|jira|meet|miro_co_pilot|private_mode|voting|shape_library|showtime_handoff|media_player): Action to start.
            + `data-duration`: Countdown duration.

            ```xml
            <rect data-type="custom-widget" data-widget-type="action_button" data-action="countdown" data-duration="05:00" x="100" y="100" fill="none" stroke="none" />
            ```

            ##### ALIGNMENT_SCALE
            A team-alignment voting scale from a low to a high position.

            + natural size: 700x181
            + `data-title`; alias: `data-content`: Voting prompt.
            + `data-lowest`: Low-end label.
            + `data-neutral`: Midpoint label.
            + `data-highest`: High-end label.

            ```xml
            <rect data-type="custom-widget" data-widget-type="alignment_scale" data-title="Confidence in the plan" data-lowest="Not at all" data-neutral="Unsure" data-highest="Fully" x="100" y="100" fill="none" stroke="none" />
            ```

            ##### CARD
            A task card for a standalone work item near related board content.

            - Use a kanban instead of arranging cards into workflow lanes.
            - Use data-color to distinguish category, priority, or owner.
            - Useful theme colors include #2d9bf0, #da0063, #00b86b, #ff8c00, #8b5cf6, and #2d3142.
            - A card renders 60px tall, or 88px with a description, whatever height is authored, centered on the authored box. Author that exact height so the box matches what renders; a smaller authored height makes the card overflow it both above and below.

            + natural size: 320x60 without a description; 320x88 with a description
            + `data-title`: Card title.
            + `data-color`: Hex theme color.
            + `data-description`: Card body text.

            ```xml
            <!-- Card with a description -->
            <rect data-type="custom-widget" data-widget-type="card" data-title="Review design specs" data-description="Check the final proposal" data-color="#da0063" x="100" y="100" width="320" height="88" fill="none" stroke="none" />

            <!-- Card without a description -->
            <rect data-type="custom-widget" data-widget-type="card" data-title="Ship release notes" data-color="#2d9bf0" x="100" y="220" width="320" height="60" fill="none" stroke="none" />
            ```

            ##### CODE
            A syntax-highlighted code block for snippets, configuration, queries, and commands.

            - Use this instead of simulating code with shapes and text.
            - Supported languages include JavaScript, TypeScript, Python, C++, Java, Go, Rust, Swift, Ruby, SQL, HTML, CSS, JSON, GraphQL, Kotlin, Mermaid, and YAML; unknown values become plain text.

            + element body or `data-content`: Code text; use the body for multiline content and preserve indentation.
            + `data-language`: Syntax highlighter language.
            + `data-title`: Optional filename or caption.
            + `data-line-numbers`: Whether to show line numbers.

            ```xml
            <rect data-type="custom-widget" data-widget-type="code" data-language="python" data-title="example.py" data-line-numbers="true" x="100" y="100" width="400" height="200" fill="none" stroke="none">print(&quot;hello&quot;)</rect>
            ```

            ##### DOT_VOTING
            A dot-voting session container for voting on nearby widgets.

            + natural size: 276x107
            + `data-title`; alias: `data-content`: Session title.

            ```xml
            <rect data-type="custom-widget" data-widget-type="dot_voting" data-title="Vote for top ideas" x="100" y="100" fill="none" stroke="none" />
            ```

            ##### DYNAMIC_POLL
            A live-session poll for a multi-choice activity.

            - Prefer poll unless the user asks for a live facilitation activity.
            - Create-only: it cannot be edited or moved after creation.
            - To change it, delete and recreate it; existing votes are lost.

            + `data-title`; alias: `data-content`: Poll topic.
            + element body or `data-options="a|b"`: Choices, one per body line; restating them replaces the list.

            ```xml
            <rect data-type="custom-widget" data-widget-type="dynamic_poll" data-title="Which direction?" x="100" y="100" fill="none" stroke="none">Option A
            Option B
            Option C</rect>
            ```

            ##### EMBED
            An embedded external resource, URL preview, or iframe.

            + `data-title`; alias: `data-content`: Optional label.
            + `data-url`: Resource URL.

            ```xml
            <rect data-type="custom-widget" data-widget-type="embed" data-title="Design doc" data-url="https://example.com/spec" x="100" y="100" fill="none" stroke="none" />
            ```

            ##### EMOJI
            A single large emoji character or sequence.

            + `data-content`; alias: `data-emoji`: Emoji character or sequence.

            ```xml
            <rect data-type="custom-widget" data-widget-type="emoji" data-content="&#x2705;" x="100" y="100" fill="none" stroke="none" />
            ```

            ##### ESTIMATES
            A planning-poker estimation activity.

            + `data-title`; alias: `data-content`: Activity title.
            + `data-estimates-type` (fibonacci|t_shirt): Estimation scale; default is fibonacci.

            ```xml
            <rect data-type="custom-widget" data-widget-type="estimates" data-title="Sprint sizing" data-estimates-type="fibonacci" x="100" y="100" fill="none" stroke="none" />
            ```

            ##### FLIP_CARD
            A two-sided card that flips on click for questions, flashcards, or icebreakers.

            - Its rendered size is fixed at its natural size whatever is authored; leave at least 520px between vertical neighbors.

            + natural size: 320x500
            + `data-title`; alias: `data-content`: Front title.
            + `data-front-text`: Front body text.
            + `data-back-title`: Back title.
            + `data-back-text`: Back body text.

            ```xml
            <rect data-type="custom-widget" data-widget-type="flip_card" data-title="Question" data-front-text="What is DNS?" data-back-title="Answer" data-back-text="The internet phone book" x="100" y="100" fill="none" stroke="none" />
            ```

            ##### PEOPLE
            A pinned list of workspace members.

            - Use only real Miro user ids already present in the workspace; omit the widget if none are available.

            + natural size: 276x518
            + `data-title`; alias: `data-content`: Widget title.
            + `data-user-ids`: Comma-separated workspace user ids.

            ```xml
            <rect data-type="custom-widget" data-widget-type="people" data-title="Core team" x="100" y="100" fill="none" stroke="none" />
            ```

            ##### POLL
            An editable board poll with a topic and choices.

            - Restating the options replaces the full list and clears existing votes.

            + `data-title`; alias: `data-content`: Poll topic.
            + element body or `data-options="a|b"`: Choices, one per body line.

            ```xml
            <rect data-type="custom-widget" data-widget-type="poll" data-title="Which direction?" x="100" y="100" fill="none" stroke="none">Option A
            Option B
            Option C</rect>
            ```

            ##### SPINNER
            A random picker wheel for text choices or workspace members.

            - Restating the options replaces the full list and resets the current state.

            + natural size: 430x430
            + `data-spinner-type` (text|people): Text uses option labels; people uses workspace user ids.
            + element body or `data-options="a|b"`: Choices, one per body line.

            ```xml
            <rect data-type="custom-widget" data-widget-type="spinner" data-spinner-type="text" x="100" y="100" fill="none" stroke="none">Alice
            Bob
            Carol</rect>
            ```

            ##### USER_CARD
            A person profile card for team pages, org charts, and ownership labels.

            + `data-title`; alias: `data-content`: Person name.
            + `data-description`: Role or profile detail.

            ```xml
            <rect data-type="custom-widget" data-widget-type="user_card" data-title="Jane Doe" data-description="Backend engineer" x="100" y="100" fill="none" stroke="none" />
            ```

            #### STRUCTURED WIDGETS

            ##### DIAGRAM
            A structured diagram generated from Mermaid source.

            - Prefer one diagram widget over hand-assembling a node-and-edge diagram from shapes and connectors.
            - Best rendering for flowchart, ERD, UML class, and UML sequence; other Mermaid types fall back to a plainer renderer.
            - Before writing the Mermaid body, call canvas_load_format_skill(format_name="diagramming", notation=<what you draw>) for colors and a worked example.
            - No Mermaid notation and no native widget fit (e.g. a mind map, concept map, freeform sketch)? You must hand-assemble from shapes and connectors -- but FIRST call canvas_load_format_skill(format_name="diagramming", notation="free_form"), THEN build it with create_from_svg following that guidance. Do not skip straight to create_from_svg.
            - Never author a Mermaid gantt or timeline here; a Gantt chart, timeline, schedule, or roadmap uses the native timeline widget unless the user asks for it "with mermaid".
            - The foreignObject body must be non-empty Mermaid text with no child elements.
            - Start Mermaid at column zero or indent every line uniformly.
            - Use Mermaid syntax through version 10.
            - The board fixes the widget at 1600x900 and does not support SVG-driven moves or deletion.
            - Read-back includes the Mermaid source and title; an unchanged id-matched diagram is left alone, so resend one only when you change its source or title.
            - Availability is per user; an unavailable diagram is skipped without blocking other widgets.

            + natural size: 1600x900
            + element body: Mermaid source; XML-escape special characters.
            + `data-title`: Diagram title.

            ```xml
            <foreignObject id="flow" x="100" y="100" width="1600" height="900" data-type="diagram" data-title="Auth flow">
            flowchart TD
                A[Client] --&gt; B[API]
            </foreignObject>
            ```

            ##### DOC
            A long-form markdown document for briefs, notes, specs, and meeting records.

            - The foreignObject body must be non-empty plain markdown with no child elements.
            - Author 784px width and at least 1105px height for layout planning; height auto-sizes.
            - Use standard Markdown, start with an H1, and keep the body at column zero.
            - Updating the body replaces the document content.
            - To move an existing doc without replacing content, send only `data-type`, `data-miro-id`, `x`, and `y`; omit the body.

            + element body: Markdown source; XML-escape special characters.

            ```xml
            <foreignObject id="brief" x="100" y="100" width="784" height="1105" data-type="doc">
            # Project brief

            - Goal one
            - Goal two
            </foreignObject>
            ```

            ##### TABLE
            A structured dataset shown as a table, kanban board, or timeline.

            - The foreignObject must contain exactly one table with one th header row; every td row must match its column count.
            - Use kanban for status workflows and timeline for schedules, roadmaps, or Gantt charts; prefer this native timeline over a Mermaid timeline/gantt diagram unless the user asks for it "with mermaid".
            - Header titles must be unique and non-empty. Empty cells are valid.
            - Cells contain pure data; merged cells, styling, caption, tfoot, nested tables, and undeclared attributes are not supported.
            - Kanban columns: Title (text, required); Description (text); Status (select, required); Assignee (person); Start Date (date); End Date (date); Estimate (number); Priority (select); Tags (select, multi-value).
            - Timeline columns: Title (text, required); Description (text); Status (select); Assignee (person); Start Date (date, required); End Date (date, required); Estimate (number); Priority (select).
            - Kanban and timeline accept only those column names, matched case-insensitively; timeline dates determine the visible range.
            - Select cells must match a declared option; Status option order defines kanban lanes.
            - Select options must be declared and are never inferred from cell values.
            - Person cells use workspace user ids; link cells use URLs or markdown links.
            - Only link cells may contain markup, as `<a href="...">label</a>`; links accept http and https URLs or scheme-less domains.
            - Number cells are numeric and date cells use ISO 8601 values.
            - Multi-select and multi-person cells use commas; multi-link cells use one link per line.
            - Status and Priority are single-value; Tags is always multi-value.
            - Cells, rows, columns, title, and layout are editable. Size is not: a table sizes itself from its column widths, its kanban lanes, or its timeline range, so an authored width and height never change how big it is.
            - To move one without touching its content, send the element with no table inside it: `<foreignObject data-type="table" data-miro-id="..." x="..." y="..."/>`. `data-type` identifies the widget, so it is required even when the body is omitted.
            - Edits are addressed by the ids the read stamps: `data-field-id` on each th, `data-record-id` on each tr. Keep them and an edit stays an edit instead of a rewrite.
            - The body may carry only the rows and columns you are touching: anything you leave out keeps its current value. A one-cell change is one tr, but that tr restates all of its cells, positionally against the ths you send.
            - To add, send a th or tr with no id. To delete, send it with its id and `data-deleted="true"` - a bare `<tr data-record-id="..." data-deleted="true"/>` is enough. Omitting an element never deletes it.
            - Never invent an id: one this table does not have is rejected, and so is a header whose columns carry none at all.
            - Select option colors are create-only. Order follows the body only when the body lists every column or row; in a partial body the ones you leave out keep their place, and new ones go last.
            - Read-back is normalized: date formats and person typing may be lost, and multi-values may gain comma spacing.
            - Read-back includes layout, title, columns, and rows. Inspect it before copying.
            - Read-back width and height are measured, not stored, so they can be missing or zero. Treat them as the table's footprint for laying out around it, never as a size to set.
            - An unreadable table becomes a read-only placeholder.
            - Kanban and timeline are created as tables and switched automatically. If switching fails, do not recreate the table; it already exists in table layout.

            + `data-title`: Widget title.
            + `data-type` (table|kanban|timeline): Board presentation mode.
            + TableColumn fields:
              + element body: Column title inside the th element.
              + `data-type` (text|number|date|select|link|person): Cell value type; default is text.
              + `data-options`: Required select options as labels with optional :#hex colors.
              + `data-decimals`: Decimal places for number columns.
              + `data-format`: Display format for date columns.
              + `data-multiple`: Allow multiple select, link, or person values where the layout permits it.
              + `data-field-id`: Board id of the column, echoed back from a read; identifies it on update.

            ```xml
            <foreignObject id="plan" x="100" y="100" width="640" height="400" data-type="table" data-title="Plan"><table><thead><tr><th>Task</th><th data-type="select" data-options="Todo:#cccccc, Done:#00b86b">Status</th></tr></thead><tbody><tr><td>Review</td><td>Todo</td></tr></tbody></table></foreignObject>
            ```


            ### 3. VALID WIDGET ATTRIBUTES

            Available font families are: Abril Fatface, Arial, Bangers, Caveat, EB Garamond, Formular, Fredoka One, Georgia, Graduate, Gravitas One, Lemon Tuesday, Nixie One, Noto Sans, Open Sans, Permanent Marker, Plex Mono, Plex Sans, Plex Serif, PT Sans, PT Sans Narrow, PT Serif, Rammetto One, Roboto, Roboto Condensed, Roboto Mono, Roboto Slab, Spoof, Tiempos Text, Times New Roman, Titan One.

            ROTATION: shapes, text, cards, and custom widgets accept data-rotation="degrees" (e.g. data-rotation="15"; negative values allowed; applied around the widget center). An element's own transform="rotate(deg)" is honored as a fallback when data-rotation is absent. Stickies accept the attribute but do not visually rotate. Frames, images, and connectors do not rotate. Omit the attribute for unrotated widgets - 0 is the default.

            ### 4. VERY IMPORTANT NOTES

            - Elements outside frames use ABSOLUTE coordinates (relative to canvas origin 0,0).
            - Inside a <g data-frame>, ALL coordinates are RELATIVE to the frame. The <g> uses transform="translate(x,y)" to position the frame on the canvas. Example: <g transform="translate(3000,2000)" data-frame="Title"><rect data-type="frame" x="0" y="0" width="1500" height="1000" fill="#fff" data-title="Title" /><rect data-type="sticky" x="50" y="50" width="100" height="100" data-color="yellow" /></g> - the sticky is at canvas position (3050, 2050).
            - Use hex colors (e.g. fill="#1a1a1a") for all fill, stroke, and color attributes. Named CSS colors like "red" or "black" also work but hex is preferred.
            - For a <text> element, y is the baseline (bottom of text): to gap a title and subtitle, the subtitle y must be at least title_y + title_font_size + desired_gap (e.g. title at y="100" font-size="40" -> a 20px-gap subtitle at y="160"). A <textArea>, by contrast, uses TOP-LEFT y and stacks by box: next_y = prev_y + prev_height + gap.
            - Escape XML special characters in ALL attribute values and text content, or the whole SVG fails to parse and nothing is created. Specifically: & becomes &amp;, < becomes &lt;, > becomes &gt;. This applies to titles, labels, data-content, and standalone <text> alike - e.g. data-frame="Create &amp; Manage", data-content="A &lt; B". A raw & (as in "Create & Manage") is the most common cause of a failed request. Already-escaped entities like &amp; must not be double-escaped.
            - Don't use linebreaks inside data-content attribute values. SVG elements themselves should be on separate lines for readability.
            - References must be pasted as full URLs (https://...). Shorthand like "PR #123", "ref: JIRA-456", or bare ticket numbers does NOT turn into a link on the board - it stays dead text. A full http(s) URL in text/sticky/shape content becomes a real clickable link automatically. For a custom label instead of the raw URL, author the anchor explicitly with escaped markup, e.g. data-content="&lt;a href=&quot;https://...&quot;&gt;the design doc&lt;/a&gt;". Omit the reference entirely if you do not have the real URL. Same rules also apply to widget references. Any widget reference can and should be deep-linked by appending ?moveToWidget=<data-miro-id> to the board URL. Clicking on a link like that pans the user's viewport to that widget. Use these links ACTIVELY: whenever you build a table of contents, index, legend, or overview, or otherwise refer to another frame/section/widget, make the reference a real deep-link instead of dead text. A widget id is just an internal technical number, so showing it to the user is not good UX. Try to hide it under a label to avoid showing a raw id.
            - DO NOT create weird freeform shapes, only use the ones that are available, creatively.
            - Standalone text is for: a freestanding heading/label (<text>), a flowing paragraph or list block (<textArea>), or text freely positioned over a background shape. Never use standalone text to label a shape that should use data-content (centered text). Reach for <textArea> whenever the block is more than one line.
            - Z-INDEX IS DETERMINED BY CREATION ORDER. Elements created first are behind, elements created last are in front. If a line connects shapes, create the line BEFORE the shapes so the shapes sit on top of it. This is critical for timelines, flowcharts, and any connected layouts.
            - Don't create a superframe to wrap everything, everything gets directly placed on the infinite canvas.
            on IDs:
            + There are TWO distinct id attributes. Do not confuse them.
            + `id` (the local SVG id, e.g. id="s1", id="box2", id="f1"): YOU author these, short and unique, so connectors can reference widgets via data-start/data-end. For frames, place the id on the <g> element: <g id="f1" transform="translate(x,y)" data-frame="Title">.
            + `data-miro-id` (the board identity of an already-created widget): the SERVER assigns these. NEVER author, invent, guess, or copy a data-miro-id. The only valid source is the result_svg returned by canvas_create_from_svg or canvas_update_from_svg (or canvas_read_as_svg). Reuse those values verbatim.


            ## 5. Composition guidelines

            Quality comes from composition, not decoration:

            - CLUSTER BY MEANING. Related stickies sit close, 20-40px apart, with slight natural offsets rather than a perfect grid. Separate clusters by 100px or more.
            - ZONES: mark a region with a `<shape type="round_rectangle" fill="none" border-color="#94a3b8" border-style="dashed">` behind its content, titled by a `<text ...>` above it (anchor `top-left` at the zone's x, y - 28).
            - PANELS: for card-like content (a worked example, a legend, a short annotated list) use a `<shape type="round_rectangle" fill="#ffffff" border-color="#dde1e7">` as the background and place `<text>` elements on top: a heading lead line, then one `<text>` per row (bullets as rows, each with a `w` so long rows wrap), stacked at about 28px pitch. Size the shape from the row count plus 20-24px padding on each side. The panel shape itself carries no body text. Never use a `<doc>` for this.
            - COLOUR DISCIPLINE: 2-3 sticky colours per board with consistent meaning (for example `light_yellow` = task, `light_pink` = blocker, `light_green` = done). Muted fills for shapes (`#eef2ff`, `#f0fdf4`, `#fef3c7`); saturated colour only for emphasis.
            - READING ORDER: place content so it scans left to right, top to bottom, and put the title or legend near the top-left.
            - COLLABORATION: Miro boards are fundamentally a collaboration surface. Identify such opportnities and create spaces, widgets and layouts for that. Sticky dropping regions, polls, alignment scales..


            ## 6. CREATE AND UPDATE PROTOCOL

            + canvas_create_from_svg and canvas_update_from_svg are the only tools that can be used to edit a board from a <svg> composition.
            + on the first call, use canvas_create_from_svg to upload the <svg> composition to a Miro board which already manages composition placement and collision avoidance, so no need to fetch the full board state for that
            + after canvas_create_from_svg, use canvas_update_from_svg in subsequent calls to iterate over the created composition.
            + some widgets expand automatically, so their final dimensions may differ from those authored in the SVG. canvas_create_from_svg and canvas_update_from_svg stamp their estimated dimensions into result_svg and report the ids whose dimensions changed.
            + REQUIRED: whenever a call reports changed dimensions, immediately check those widgets in result_svg and reposition affected widgets with canvas_update_from_svg. Do not report completion until spacing is consistent and all resulting overlaps are resolved, leave a reasonable margin as a buffer in case the estimates are not exactly correct.
            + canvas_update_from_svg is additive: removing a widget from the SVG does NOT delete it from the board.
            + for iterating over an existing <svg> composition the canvas_update_from_svg tool can be used to apply the changes to the board.
            + To EDIT an existing widget: keep its data-miro-id exactly as it came back in the previous result_svg, and change only the attributes you want (text, color, position, ...). For a position-only expandable widget update, send only data-type, data-miro-id, x, and y. Matching is by data-miro-id.
            + PATCH SEMANTICS (stickies, shapes, text, cards, frames, images, custom widgets): on an element carrying data-miro-id, an OMITTED attribute keeps its current board value - only the attributes you write are applied. So a color-only change can be a minimal stub: <rect data-miro-id="30123" data-type="sticky" data-color="yellow" />. CLEARING TEXT: data-content="" empties a sticky's or a shape's text; a card's text is data-title / data-description (data-description="" clears the description); a text widget (<text> or <textArea>) is removed by deleting it, not by blanking its body. GEOMETRY IS ONE UNIT: to move or resize, restate x, y, width AND height together (copied from the latest result_svg) - a partial bbox is ignored as ambiguous. A <textArea> restates its box as x, y and width together (height optional) from the result_svg; a partial box leaves the position untouched. A frame's geometry needs its transform plus the background rect's width/height, and a frame keeps its live title unless you write a NON-EMPTY data-frame (data-frame="" on a sparse wrapper never wipes the title). An <image>'s height always follows the source's aspect ratio, so an authored height that disagrees is ignored, and swapping href alone re-sizes the image to the new source's natural size around its center - restate the bbox on the same element to pin a footprint. ALWAYS keep the element's type markers on a stub (data-type="sticky", data-widget-type="card", the <text>/<textArea> tag): a bare <rect> reads as a plain shape, and a partially-authored stub whose type does not match the live widget is reported as a failed item naming both types. Keep sparse elements in their original frame <g>. The same PATCH semantics apply to every custom widget (its own data-* attributes, plus x/y/width/height as one unit). Body-carried payloads follow the same rule: a code widget's body IS its content, so a stub with an empty body keeps the live code (data-title alone just renames the caption), and writing a body replaces it; the same holds for poll/spinner/dropdown option lists. Connectors require full restating; a table takes position-only updates (see its widget reference); dynamic_poll is CREATE-ONLY and an id-matched edit to one is reported as a failed item.
            + To ADD a new widget: leave data-miro-id OFF entirely (just give it a local `id` if a connector needs it). canvas_update_from_svg creates it and returns its assigned data-miro-id in the result_svg, which you reuse on the next iteration.
            + To DELETE a widget: keep its data-miro-id and add data-deleted="true" to the element. A minimal stub is enough - e.g. <rect data-miro-id="3458764515349839821" data-deleted="true" /> - you do NOT need to reproduce the element's other attributes. Deletion is explicit and per-element: only elements carrying data-deleted="true" are removed; simply dropping an element from the SVG never deletes it. Only widgets created through this tool (managed) can be deleted; placeholders and foreign items are read-only and a marker on them is refused. Connectors delete the same way (data-deleted="true" on the <line>/<path> with its data-miro-id).
            + CONFIRM BEFORE DELETING: deletion is destructive and cannot be undone through this tool. Before sending any SVG that contains data-deleted="true", confirm the specific items to remove with the user first.
            + ITERATION RULE: always start from the most recent result_svg, edit it in place, and feed it back. Do not regenerate the SVG from scratch and do not transcribe ids from memory.
            + A data-miro-id that does not exist on the board is reported as a FAILED update for that element (likely a stale or invented id) - it is never silently created as a duplicate. So only ever reuse ids from a prior result_svg; if you are unsure of the current ids, call canvas_read_as_svg.


            ## 7. HOW TO SEARCH, READ, AND NAVIGATE A BOARD

            + canvas_search is your entry point to anything you want to find in the canvas, it allows you to traverse the board and narrow down your scope. Full board reads are disabled to avoid overwhelming the context window.
            + If you are completely new to the board, and the user hasn't given you any context for what to search, you may call canvas_search with result_mode="overview" to get a rough high-level index of what's in the board, if you are asked for a rough summary this is usually enough, unless you or the user want to get a more granular view.
            + For a summary or a request with no search clue, call canvas_search once with result_mode="overview" and no patterns. Never use a match-all regex to discover the board.
            + Use result_mode="areas" for remembered sections, sessions, layouts, or concepts. Use result_mode="matches" for exact items, occurrences, IDs, attributes, or captures.
            + Start with one areas call that batches a few independent clues. Plain patterns search decoded text literally and case-insensitively. Prefix only structural SVG regexes with re:.
            + Use target_id only to inspect one candidate and cursor only when a useful result page is incomplete. Do not enumerate the board.
            + STOP when one result clearly satisfies the request, don't go rogue trying to read everything; then call canvas_read_as_svg. Pass scope.x, scope.y, scope.width, and scope.height as scope_x, scope_y, scope_width, and scope_height. Use widget_ids only for a narrowly targeted read.
            + NEVER try brute force through a full board read by calling canvas_read_as_svg multiple times, always use canvas_search to narrow the scope and only do a bbox read once you have gained enough confidence through the search, if the bbox read doesn't validate what you were looking for, go back to the search instead of attempting more uninformed bbox reads.
            + If the user asks for a general summary, just use the overview, don't go rogue trying to read everything.  Interpret it for the user don't just forward the raw results. Only drill down if the user asks for more detail.
            + If there is information you already have in context, just reuse it, don't re-read unnecessarily.

          type: string
        success:
          default: true
          type: boolean
        message:
          default: ""
          type: string
    annotations:
      title: Canvas Composer
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: canvas_load_format_skill
    title: Load Format Skill
    description: "Load supplementary authoring guidance (a skill) for a specific composition format, layered ON TOP OF the general canvas format. PREREQUISITE: call canvas_get_canvas_composer_skill FIRST -- this tool assumes you already know the SVG board format and only adds format-specific styling and examples. Do not call it as your first step, and never in place of the composer skill. Content is still created with canvas_create_from_svg / canvas_update_from_svg. Available formats: 'diagramming' (styling and worked examples for Mermaid diagram widgets). For 'diagramming', pass the notation you are drawing to get that notation's color defaults and worked example. Call once per format/notation in a conversation and reuse the guidance."
    inputSchema:
      type: object
      properties:
        format_name:
          const: diagramming
          description: The composition format to load guidance for. 'diagramming' for styling and worked examples of Mermaid diagram widgets.
          type: string
        notation:
          default: null
          description: "For format_name='diagramming', the diagram notation you are drawing: 'flowchart', 'entity_relationship', 'uml_class', or 'uml_sequence' for a Mermaid diagram widget, or 'free_form' for a hand-assembled diagram from shapes and connectors (use only when no Mermaid notation and no native widget fits, e.g. a mind map). Returns that notation's guidance. Omit to get the shared color contract plus the list of supported notations."
          enum:
            - flowchart
            - entity_relationship
            - uml_class
            - uml_sequence
            - free_form
          type: string
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - format_name
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        format_name:
          type: string
        notation:
          anyOf:
            - type: string
            - type: "null"
        skill:
          type: string
      required:
        - format_name
        - notation
        - skill
    annotations:
      title: Load Format Skill
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: canvas_read_as_svg
    title: Read Board as SVG
    description: "Read one board area or specific items as a canvas-composer SVG document. Use canvas_search to find a scope, then provide all four scope fields. Area reads fail above 500 widgets; narrow the scope and retry. Use widget_ids only for specific items; selecting a container (a frame, slide deck, or prototype) includes everything nested inside it. "
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        widget_ids:
          default: null
          description: Required unless all four scope fields are set. Return only the items with these data-miro-id values. Ancestor frames are added automatically so positions stay correct, and selecting a container (a frame, slide deck, or prototype) pulls in everything nested inside it. Unknown ids are skipped.
          items:
            type: string
          type: array
          nullable: true
        scope_x:
          default: null
          description: Working area left edge.
          type: integer
          nullable: true
        scope_y:
          default: null
          description: Working area top edge.
          type: integer
          nullable: true
        scope_width:
          default: null
          description: Working area width.
          type: integer
          nullable: true
        scope_height:
          default: null
          description: Working area height.
          type: integer
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        svg:
          type: string
        item_count:
          type: integer
        skipped_count:
          type: integer
        miro_url:
          type: string
        scope_x:
          anyOf:
            - type: integer
            - type: "null"
          default: null
        scope_y:
          anyOf:
            - type: integer
            - type: "null"
          default: null
