$schema: https://mcpdesc.org/schema/mcp-description/0.8.0-rc.2.json
mcpdesc: 0.8.0
info:
  name: Miro MCP
  version: 3.4.6
  websiteUrl: https://mcp.miro.com
  icons:
    - src: https://mirostatic.com/app/images/general/logo.svg
protocolVersions:
  - "2025-11-25"
transports:
  - type: streamable-http
    url: https://mcp.miro.com
instructions: The canvas_* tools enable the agent to read, create, and update Miro boards using Canvas Composer SVG, Miro's unified interaction/representation protocol for the canvas. To understand how to use the canvas_* tools in the appropiate way, please refer to the canvas_composer_skill tool first to understand the guidelines and protocol.
capabilities:
  - experimental: {}
    logging: {}
    resources:
      subscribe: false
      listChanged: true
    tools:
      listChanged: true
    extensions:
      io.modelcontextprotocol/ui: {}
tools:
  - name: preview_resource_poll
    title: Poll Preview Resource
    description: "Check whether a Miro create-result preview resource is ready. Returns pending until the preview is available. Tags: preview, resource."
    inputSchema:
      type: object
      properties:
        preview_resource:
          description: MCP preview resource URI returned by a Miro create tool
          pattern: ^miro-preview://create/[A-Za-z0-9_-]{16,128}$
          type: string
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - preview_resource
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        status:
          description: Preview status
          enum:
            - pending
            - ready
            - failed
          type: string
        mime_type:
          anyOf:
            - description: Supported preview content MIME types.
              enum:
                - image/svg+xml
              type: string
            - type: "null"
          default: null
          description: Preview image MIME type when ready
        data_base64:
          anyOf:
            - type: string
            - type: "null"
          default: null
          description: Base64-encoded preview content bytes when ready
      required:
        - status
      description: Response returned by the preview polling tool.
    annotations:
      title: Poll Preview Resource
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: user_who_am_i
    title: Who Am I
    description: Returns the identity of the current authenticated user.
    inputSchema:
      type: object
      properties:
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        user_id:
          description: Unique user identifier.
          type: string
        team_id:
          description: Team identifier.
          type: string
        workspace_id:
          description: Workspace identifier.
          type: string
        org_id:
          description: Organization identifier.
          type: string
      required:
        - user_id
        - team_id
        - workspace_id
        - org_id
      description: Identity of the currently authenticated user.
    annotations:
      title: Who Am I
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: board_search_boards
    title: Search Boards
    description: Search and list boards accessible to the current user, scoped to their team. Returns board metadata — name and URL — suitable for navigating to a specific board or discovering relevant boards before operating on them. Use this tool when the user wants to find a board by name or description, or discover which boards are available before using other board tools. Supports offset-based pagination.
    inputSchema:
      type: object
      properties:
        query:
          default: ""
          description: "Text to search for in board names and descriptions. Examples: 'product roadmap', 'Q4 planning', 'design review'. Leave empty to list all accessible boards."
          type: string
        limit:
          default: 20
          description: "Maximum number of boards to return per page. Range: 1-50. Default: 20."
          maximum: 50
          minimum: 1
          type: integer
        offset:
          default: 0
          description: "Zero-based index of the first board to return. Use with limit for pagination. Example: offset=20 with limit=20 returns the second page."
          minimum: 0
          type: integer
        owned_by_me:
          default: false
          description: When true, restricts results to boards owned by the current user. Useful when the user asks to see 'my boards' or 'boards I own'.
          type: boolean
        include_content:
          default: false
          description: Controls whether to search inside board content or only board name and description. Set to true ONLY when the user explicitly says they are looking for something written inside a board (e.g. 'find the board that has X in it', 'search inside boards for Y'). Default is false. Do not set to true just because the user provided a search query.
          type: boolean
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        data:
          description: List of minimal board records
          items:
            description: Board metadata returned by search.
            properties:
              name:
                description: Name of the board
                title: Name
                type: string
              miro_url:
                description: Full Miro URL to open the board
                title: Miro Url
                type: string
              description:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: Board description
                title: Description
              team_name:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: Name of the team that owns the board
                title: Team Name
              owner:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: Name of the board owner
                title: Owner
              modified_at:
                anyOf:
                  - format: date-time
                    type: string
                  - type: "null"
                default: null
                description: Date and time the board was last modified (UTC)
                title: Modified At
              created_at:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: ISO 8601 UTC timestamp of when the board was created
                title: Created At
            required:
              - name
              - miro_url
            title: BoardSummary
            type: object
          title: Data
          type: array
        total:
          description: Total number of boards matching the query
          title: Total
          type: integer
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          default: null
          description: Opaque cursor token for fetching the next page (MCP nextCursor)
          title: Nextcursor
        has_more:
          description: Whether there are more results available
          title: Has More
          type: boolean
      required:
        - data
        - total
        - has_more
      description: Response model for board listing using plain dict structures.
      title: ListBoardsResponse
    annotations:
      title: Search Boards
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: board_list_items
    title: Read Board Items
    description: List items on a board with cursor-based pagination. For slide content, prefer slides_read_html over this tool.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        limit:
          default: 50
          description: Max items per page (10-1000). Capped at 50 when filtering by parent.
          type: integer
        cursor:
          default: null
          description: Opaque cursor for next page
          type: string
          nullable: true
        item_type:
          default: null
          description: Filter items by type. Use to get items of a specific type like images, cards, etc. Tables are 'data_table_format'; Miro Docs are 'doc_format'. Connectors, diagrams, mind maps and kanbans are not item types and cannot be filtered on.
          enum:
            - app_card
            - card
            - data_table_format
            - document
            - doc_format
            - embed
            - frame
            - image
            - preview
            - shape
            - sticky_note
            - text
          type: string
          nullable: true
        type:
          default: null
          description: Filter items by type. Use to get items of a specific type like images, cards, etc. Tables are 'data_table_format'; Miro Docs are 'doc_format'. Connectors, diagrams, mind maps and kanbans are not item types and cannot be filtered on.
          enum:
            - app_card
            - card
            - data_table_format
            - document
            - doc_format
            - embed
            - frame
            - image
            - preview
            - shape
            - sticky_note
            - text
          type: string
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        data:
          description: List of items
          items:
            description: Cleaned item model with tracking fields removed.
            properties:
              id:
                description: The ID of the item
                type: string
              type:
                description: The type of the item
                type: string
              data:
                additionalProperties: true
                description: The item data
                type: object
              style:
                anyOf:
                  - additionalProperties: true
                    type: object
                  - type: "null"
                default: null
                description: The item style
              geometry:
                anyOf:
                  - additionalProperties: true
                    type: object
                  - type: "null"
                default: null
                description: The item geometry
              position:
                anyOf:
                  - additionalProperties: true
                    type: object
                  - type: "null"
                default: null
                description: The item position
              parent:
                anyOf:
                  - description: Parent item reference containing the parent item's ID.
                    properties:
                      id:
                        description: The ID of the parent item
                        type: string
                    required:
                      - id
                    type: object
                  - type: "null"
                default: null
                description: The item parent
              miro_url:
                description: Full Miro URL to view this item on the board.
                readOnly: true
                type: string
            required:
              - id
              - type
              - miro_url
            type: object
          type: array
        total:
          description: Total number of items matching the query
          type: integer
        error_code:
          anyOf:
            - type: string
            - type: "null"
          default: null
          description: Machine-readable error code
          examples:
            - ITEM_NOT_FOUND
            - BOARD_NOT_FOUND
            - PERMISSION_DENIED
        details:
          anyOf:
            - additionalProperties:
                type: string
              type: object
            - type: "null"
          default: null
          description: Additional error details
          examples:
            - board_id: uXjVOakxTk0=
              item_id: "3458764516062720430"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
          default: null
          description: Opaque cursor token for fetching the next page (MCP nextCursor)
        has_more:
          description: Whether there are more results available
          type: boolean
      required:
        - data
        - total
        - has_more
      description: |-
        Paginated response model for listing items on a board.

        Follows MCP cursor-based pagination: nextCursor and has_more fields.
    annotations:
      title: Read Board Items
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: board_create
    title: Create New Board
    description: "Create a new Miro board. To place the board inside a space, pass parent_space_url - either the space URL or the space content item id. Creating it in the space directly saves the extra board_move call that creating it at the team root would need. IMPORTANT: Always confirm with the user before creating a board. This action creates a new board and cannot be undone."
    inputSchema:
      type: object
      properties:
        name:
          description: Name of the new board
          maxLength: 60
          minLength: 1
          type: string
        description:
          default: null
          description: Optional description for the board
          maxLength: 2000
          type: string
          nullable: true
        parent_space_url:
          default: null
          description: Space to create the content inside, given either as a full Miro space URL (e.g., 'https://miro.com/app/dashboard/space/0VM5RHCprOu2MnOHXLqp3f') or as the space content item id on its own (e.g., '0VM5RHCprOu2MnOHXLqp3f'). Omit to create at the team root instead.
          minLength: 1
          type: string
          nullable: true
        icon_emoji:
          default: null
          description: Optional single emoji to use as the board icon, e.g. "🚀". Set it when the user asks for an icon; otherwise leave it unset.
          type: string
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - name
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    annotations:
      title: Create New Board
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: space_create
    title: Create New Space
    description: "Create a new Miro space. A space organizes related content together (Boards; Documents; Tables; Diagrams; etc). Always give the space an icon: use the emoji the user asked for, and when they did not name one, pick a fitting emoji yourself from the space name. IMPORTANT: Always confirm with the user before creating a space. This action creates a new space and cannot be undone."
    inputSchema:
      type: object
      properties:
        name:
          description: Name of the new space
          maxLength: 60
          minLength: 1
          type: string
        description:
          default: null
          description: Optional description for the space
          maxLength: 2000
          type: string
          nullable: true
        icon_emoji:
          default: null
          description: Single emoji to use as the space icon, e.g. "🚀". Pass the emoji the user asked for; if they did not name one, choose a fitting emoji yourself based on the space name rather than leaving this empty.
          type: string
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - name
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    annotations:
      title: Create New Space
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: section_create
    title: Create Section
    description: "Create a new section inside a space to group related boards and content. A section must live inside a space, so provide the space URL. If no title is given, a short one is generated from the user's goal. IMPORTANT: Always confirm with the user before creating a section."
    inputSchema:
      type: object
      properties:
        space_url:
          description: A space, given either as a full Miro space URL (e.g., 'https://miro.com/app/dashboard/space/0VM5RHCprOu2MnOHXLqp3f') or as the space content item id on its own (e.g., '0VM5RHCprOu2MnOHXLqp3f'). Both the URL returned when a space is created and the content_item_id from a space listing are accepted.
          minLength: 1
          type: string
        title:
          default: null
          description: Title for the new section
          maxLength: 60
          type: string
          nullable: true
        order:
          default: null
          description: Optional position among sibling sections; higher values are ordered first. When omitted, the section is placed on top.
          type: integer
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - space_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        content_item_id:
          description: Content item ID of the created folder
          type: string
      required:
        - content_item_id
      description: Response from creating a folder.
    annotations:
      title: Create Section
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: section_delete
    title: Delete Section
    description: "Delete a section. Boards inside the section are not deleted; they are moved up to the parent space. IMPORTANT: Always confirm with the user before deleting a section."
    inputSchema:
      type: object
      properties:
        section_content_item_id:
          description: Identifier of the section to delete
          minLength: 1
          type: string
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - section_content_item_id
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    annotations:
      title: Delete Section
      readOnlyHint: false
      destructiveHint: true
      idempotentHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: section_update_metadata
    title: Update Section Metadata
    description: Rename a section or change its position among sibling sections. Provide at least one of a new title or a new order.
    inputSchema:
      type: object
      properties:
        section_content_item_id:
          description: Identifier of the section to update
          minLength: 1
          type: string
        title:
          default: null
          description: New section title
          maxLength: 60
          type: string
          nullable: true
        order:
          default: null
          description: New position among sibling sections; lower values are ordered first.
          type: integer
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - section_content_item_id
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    annotations:
      title: Update Section Metadata
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: board_create_format
    title: Create Board Format
    description: "Create a typed board format, such as a table, timeline, kanban, document, diagram, prototyping container, slide container, activities board, or embed. Use this tool when the user asks for the document/table/diagram itself as a standalone piece of content (e.g. 'create a doc in Miro about X', 'make me a table of Y'). Prefer it over adding a doc, table or diagram widget to an existing board: those tools are for adding content onto a board the user is already working on. To place the format inside a space, pass parent_space_url - either the space URL or the space content item id. Creating it in the space directly saves the extra board_move call that creating it at the team root would need. IMPORTANT: Always confirm with the user before creating content. This action cannot be undone."
    inputSchema:
      type: object
      properties:
        name:
          description: Name of the new format
          maxLength: 255
          minLength: 1
          type: string
        format_type:
          description: The kind of format to create
          enum:
            - embed
            - table
            - timeline
            - kanban
            - document
            - diagram
            - prototyping_container
            - slide_container
            - activities
          type: string
        parent_space_url:
          default: null
          description: Space to create the content inside, given either as a full Miro space URL (e.g., 'https://miro.com/app/dashboard/space/0VM5RHCprOu2MnOHXLqp3f') or as the space content item id on its own (e.g., '0VM5RHCprOu2MnOHXLqp3f'). Omit to create at the team root instead.
          minLength: 1
          type: string
          nullable: true
        embed_url:
          default: null
          description: Source URL to embed (only used when format_type is 'embed')
          type: string
          nullable: true
        icon_emoji:
          default: null
          description: Optional single emoji to use as the icon, e.g. "🚀". Set it when the user asks for an icon; otherwise leave it unset.
          type: string
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - name
        - format_type
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    annotations:
      title: Create Board Format
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: board_move
    title: Move Board
    description: Move an existing Miro board under a space or folder. Use this tool when a user asks to move a board into a space or under a folder. Provide the board and the content item id of the destination space or folder.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        target_parent_content_item_id:
          description: Content item id of the destination space or folder.
          minLength: 1
          type: string
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
        - target_parent_content_item_id
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    annotations:
      title: Move Board
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: board_move_to_team
    title: Move Board To Team
    description: Move a board to a different team.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        target_team_id:
          description: Numeric identifier of the destination team
          type: integer
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
