      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: layout_create
    title: Create Widgets
    description: |-
      DEPRECATED - superseded by the canvas tools. Before using this tool, check whether canvas_create_from_svg is available to you. If it is, use canvas_create_from_svg instead and do not call this tool. If the canvas tools are not available to you, this tool still works: use it to complete the request rather than refusing. In both cases, tell the user that the layout tools are deprecated and are being replaced by the canvas tools, and that any saved skills, prompts, custom instructions or automations referring to the layout tools should be updated to use the canvas tools. If the canvas tools are missing and their client caches the tool list, they need to fully disconnect and reconnect the Miro MCP server - refreshing the tool list is usually not enough.
      For generic board items — anything other than presentation slide decks. Use slides_create_html for those instead.
      Create multiple board items (and connectors between them) on a Miro board from DSL (Domain-Specific Language) text. PREREQUISITE: Call layout_get_dsl first to obtain the DSL format specification. Items are created using board-absolute coordinates. Frames are always created first, then all other items, then connectors last (so they can reference items by alias). Returns a list of any items that failed to be created.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        dsl:
          description: DSL text describing the items to create. Must follow the format from layout_get_dsl. Each line defines one item with its id, type, geometry, and content. If the board URL targets a frame (via moveToWidget), that frame is used as the default parent for items that do not specify parent= explicitly. parent= may reference a short local alias of a frame declared in the same DSL, or a full Miro item URL of a frame that already exists on the board.
          maxLength: 50000
          type: string
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
        - dsl
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        created_count:
          type: integer
        failed_items:
          items:
            description: An item that failed to be created.
            properties:
              id:
                type: string
              type:
                type: string
              reason:
                type: string
            required:
              - id
              - type
              - reason
            type: object
          type: array
        result_dsl:
          default: ""
          type: string
        miro_url:
          type: string
      required:
        - success
        - message
        - created_count
        - miro_url
      description: Response from the layout create tool.
    annotations:
      title: Create Widgets
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: layout_read
    title: Item Positioning
    description: |-
      DEPRECATED - superseded by the canvas tools. Before using this tool, check whether canvas_read_as_svg is available to you. If it is, use canvas_read_as_svg instead and do not call this tool. If the canvas tools are not available to you, this tool still works: use it to complete the request rather than refusing. In both cases, tell the user that the layout tools are deprecated and are being replaced by the canvas tools, and that any saved skills, prompts, custom instructions or automations referring to the layout tools should be updated to use the canvas tools. If the canvas tools are missing and their client caches the tool list, they need to fully disconnect and reconnect the Miro MCP server - refreshing the tool list is usually not enough.
      Read existing board items and return them as DSL text. When given a board URL, returns all supported top-level items (no frame children). When the URL targets a specific frame (via moveToWidget), returns the frame and its children. When the URL targets a non-frame item, returns just that item as DSL with full content. By default (mode=structured), DOCs and TABLEs are returned as shallow headers with read-only metadata (preview/length, schema/row count) so large boards stay token-light; open the DOC or TABLE by URL to read its full body. Pass mode=full to force inline DOC bodies and TABLE rows at any scope. Connectors between items in scope are returned as CONNECTOR lines (board and frame scope only). The returned DSL uses full Miro item URLs as ids and parent references; those URLs can be passed directly as miro_url to other tools (doc_get, table_list_rows, context_get, etc.) without modification, and fed back into layout_update for editing.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        mode:
          default: structured
          description: "DSL render mode: 'structured' (default) returns DOCs/TABLEs as one-line shallow headers with read-only _* metadata; 'full' inlines DOC bodies and TABLE rows. At single non-frame widget scope the response is always full."
          pattern: ^(structured|full)$
          type: string
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        dsl:
          type: string
        item_count:
          type: integer
        skipped_count:
          type: integer
        miro_url:
          type: string
      required:
        - success
        - message
        - dsl
        - item_count
        - skipped_count
        - miro_url
      description: Response from the layout read tool.
    annotations:
      title: Item Positioning
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: layout_update
