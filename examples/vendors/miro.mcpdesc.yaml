  - name: table_sync_rows
    title: Update Table
    description: |-
      Add or update rows in a Miro table.

      To update existing rows, include rowId in the row object. rowId precisely targets a single row. Get rowIds from table_list_rows. Rows without rowId are inserted as new.

      Examples:
      Update a specific row by rowId: {"rows": [{"rowId": "3", "cells": [{"columnTitle": "Status", "value": "Complete"}]}]}
      Insert new rows: {"rows": [{"cells": [{"columnTitle": "Task", "value": "New task"}, {"columnTitle": "Status", "value": "Not Started"}]}]}
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro URL to a specific item (e.g., 'https://miro.com/app/board/uXjVOakxTk0=/?moveToWidget=3458764516062720430'). Must include moveToWidget or focusWidget query parameter.
          minLength: 1
          type: string
        rows:
          description: |-
            Array of rows to add or update. Include rowId to update an existing row.
                    Rows without rowId are inserted as new.

                    [{"rowId": "3", "cells": [{"columnTitle": "Status", "value": "Complete"}]}]
                    [{"cells": [{"columnTitle": "Task", "value": "Write tests"}, {"columnTitle": "Status", "value": "To Do"}]}]
          items:
            description: Input for a single table row.
            properties:
              rowId:
                default: null
                description: Stable row identifier for targeting a specific row to update. Get rowIds from table_list_rows. Rows without rowId are inserted as new.
                pattern: ^[0-9a-zA-Z_-]{1,64}$
                type: string
                nullable: true
              cells:
                description: Array of cells in this row
                items:
                  description: |-
                    Input for a single cell value.

                    The type is inferred from the column schema during processing.
                  properties:
                    columnTitle:
                      description: Title of the column this cell belongs to
                      maxLength: 255
                      minLength: 1
                      type: string
                    value:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - type: number
                        - type: integer
                        - items:
                            type: string
                          maxItems: 5000
                          type: array
                        - items:
                            additionalProperties:
                              type: string
                            type: object
                          maxItems: 5000
                          type: array
                      description: "Cell value. For text columns: string. For select columns: displayValue string. For multiselect columns: displayValue string or list of displayValue strings. For date columns: ISO 8601 date string (e.g., '2025-07-30T22:00:00Z'). For link columns: URL string or list of link objects [{\"url\": \"...\", \"text\": \"...\"}]For person columns: Miro user ID string or list of Miro user ID strings. For number columns: number or numeric string (e.g., 42 or '3.14')."
                  required:
                    - columnTitle
                    - value
                  type: object
                type: array
            required:
              - cells
            type: object
          minItems: 1
          type: array
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
        - rows
      additionalProperties: false
    outputSchema:
      type: object
      additionalProperties: true
    annotations:
      title: Update Table
      readOnlyHint: false
      destructiveHint: true
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
  - name: table_update_view
    title: Update Table View
    description: |-
      Update a Miro table widget's view: switch it to a grid table, timeline, or kanban board. The table keeps its data; only how it is displayed changes.

      Choose layout:
      - table: plain grid (use to revert from another layout)
      - timeline: lays records out on a time axis; optionally set the visible window with timeline_start_date and timeline_end_date
      - kanban: groups records into columns; set group_by_column to the name of a select column to group by (omit for an ungrouped board)

      Only provide config that matches the chosen layout. Examples: switch to kanban grouped by Status: {"layout": "kanban", "group_by_column": "Status"}. Switch to a timeline for 2026: {"layout": "timeline", "timeline_start_date": "2026-01-01T00:00:00Z", "timeline_end_date": "2026-12-31T00:00:00Z"}.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro URL to a specific item (e.g., 'https://miro.com/app/board/uXjVOakxTk0=/?moveToWidget=3458764516062720430'). Must include moveToWidget or focusWidget query parameter.
          minLength: 1
          type: string
        layout:
          description: "The layout to apply: 'table', 'timeline', 'kanban', or 'tree'."
          enum:
            - table
            - timeline
            - kanban
            - tree
          type: string
        group_by_column:
          default: null
          description: "KANBAN only: name of the select column to group cards into columns. Omit for an ungrouped board."
          type: string
          nullable: true
        timeline_start_date:
          default: null
          description: "TIMELINE only: visible start of the timeline window in UTC format YYYY-MM-DDThh:mm:ssZ. This is the viewport, not a per-record date."
          type: string
          nullable: true
        timeline_end_date:
          default: null
          description: "TIMELINE only: visible end of the timeline window in UTC format YYYY-MM-DDThh:mm:ssZ. This is the viewport, not a per-record date."
          type: string
          nullable: true
        timeline_nesting_enabled:
          default: null
          description: "TIMELINE only: enable nested (hierarchical parent/child) rows."
          type: boolean
          nullable: true
        timeline_dependencies_enabled:
          default: null
          description: "TIMELINE only: show dependency links between records."
          type: boolean
          nullable: true
        timeline_date_unit:
          default: null
          description: "TIMELINE only: time-axis granularity."
          enum:
            - day
            - week
            - month
            - quarter
            - year
          type: string
          nullable: true
        table_nesting_enabled:
          default: null
          description: "TABLE only: enable nested (hierarchical parent/child) rows."
          type: boolean
          nullable: true
        tree_direction:
          default: null
          description: "TREE only: direction the tree grows."
          enum:
            - top_to_bottom
            - left_to_right
          type: string
          nullable: true
        view_name:
          default: null
          description: Optional new display name for the view. Applies to any layout.
          type: string
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
        - layout
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        miro_url:
          description: Board item URL of the table whose layout changed
          type: string
        layout:
          description: The layout now applied to the table
          enum:
            - table
            - timeline
            - kanban
            - tree
          type: string
      required:
        - miro_url
        - layout
      description: Response from update_view tool.
    annotations:
      title: Update Table View
      readOnlyHint: false
      destructiveHint: false
      openWorldHint: false
    _meta:
      fastmcp:
        tags: []
