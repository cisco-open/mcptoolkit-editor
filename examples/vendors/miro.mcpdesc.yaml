  - name: comment_list_comments
    title: Read Comments
    description: List comments from a Miro board or a specific item on the board. Comments include author information, messages (original comment and replies), reactions, resolved status, and position. Use limit and offset for pagination. Use from_date and to_date to filter by creation time. Use resolved to filter by resolved status.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Miro board URL. Can be a plain board URL (e.g., 'https://miro.com/app/board/uXjVGeTCXKY=/') to get a board overview, or include moveToWidget/focusWidget parameter (e.g., 'https://miro.com/app/board/uXjVGeTCXKY=/?moveToWidget=3458764654510025479') to get detailed content for a specific item.
          minLength: 1
          type: string
        limit:
          default: 20
          description: "Maximum number of comments to return per page. Range: 1-50. Default: 20."
          maximum: 50
          minimum: 1
          type: integer
        offset:
          default: 0
          description: "Zero-based offset for pagination. Default: 0."
          minimum: 0
          type: integer
        from_date:
          default: null
          description: "Return only comments created at or after this date. Format: ISO 8601 with optional time component, e.g. 2024-01-01T00:00:00Z or 2024-01-01."
          type: string
          nullable: true
        to_date:
          default: null
          description: "Return only comments created at or before this date. Format: ISO 8601 with optional time component, e.g. 2024-12-31T23:59:59Z or 2024-12-31."
          type: string
          nullable: true
        resolved:
          default: null
          description: Filter by resolved status. true returns only resolved comments, false returns only unresolved. Omit to return all comments.
          type: boolean
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        data:
          description: List of comments.
          items:
            description: A comment thread on a Miro board.
            properties:
              id:
                description: Unique identifier of the comment.
                title: Id
                type: string
              resolved:
                anyOf:
                  - type: boolean
                  - type: "null"
                default: null
                description: Whether the comment thread has been resolved.
                title: Resolved
              createdAt:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: When the comment was created.
                title: Createdat
              modifiedAt:
                anyOf:
                  - type: string
                  - type: "null"
                default: null
                description: When the comment was last modified.
                title: Modifiedat
              createdBy:
                anyOf:
                  - additionalProperties:
                      type: string
                    type: object
                  - type: "null"
                default: null
                description: User who created the comment.
                title: Createdby
              position:
                anyOf:
                  - description: Position of a comment on the board.
                    properties:
                      type:
                        description: "Position type: canvas, attached, table, or doc."
                        title: Type
                        type: string
                      x:
                        anyOf:
                          - type: number
                          - type: "null"
                        default: null
                        description: X-axis coordinate (canvas and attached types).
                        title: X
                      y:
                        anyOf:
                          - type: number
                          - type: "null"
                        default: null
                        description: Y-axis coordinate (canvas and attached types).
                        title: Y
                      itemId:
                        anyOf:
                          - type: string
                          - type: "null"
                        default: null
                        description: ID of the item the comment is attached to (attached, table, and doc types).
                        title: Itemid
                      rowId:
                        anyOf:
                          - type: string
                          - type: "null"
                        default: null
                        description: ID of the data table row the comment is attached to (table type).
                        title: Rowid
                    required:
                      - type
                    title: CommentPosition
                    type: object
                  - type: "null"
                default: null
                description: Position of the comment on the board.
              reactions:
                description: Reactions on the comment.
                items:
                  description: An emoji reaction on a comment or message.
                  properties:
                    emoji:
                      description: Emoji used as the reaction.
                      title: Emoji
                      type: string
                    userIds:
                      description: IDs of users who reacted with this emoji.
                      items:
                        type: string
                      title: Userids
                      type: array
                    createdAt:
                      anyOf:
                        - type: string
                        - type: "null"
                      default: null
                      description: When the reaction was first added.
                      title: Createdat
                  required:
                    - emoji
                    - userIds
                  title: Reaction
                  type: object
                title: Reactions
                type: array
              messages:
                description: Messages in the comment thread. The first message is the original comment; subsequent messages are replies.
                items:
                  description: A message in a comment thread (original comment or reply).
                  properties:
                    id:
                      description: Unique identifier of the message.
                      title: Id
                      type: string
                    content:
                      anyOf:
                        - type: string
                        - type: "null"
                      default: null
                      description: Text content of the message.
                      title: Content
                    createdAt:
                      anyOf:
                        - type: string
                        - type: "null"
                      default: null
                      description: When the message was created.
                      title: Createdat
                    modifiedAt:
                      anyOf:
                        - type: string
                        - type: "null"
                      default: null
                      description: When the message was last modified.
                      title: Modifiedat
                    createdBy:
                      anyOf:
                        - additionalProperties:
                            type: string
                          type: object
                        - type: "null"
                      default: null
                      description: User who created the message.
                      title: Createdby
                    reactions:
                      description: Reactions on the message.
                      items:
                        description: An emoji reaction on a comment or message.
                        properties:
                          emoji:
                            description: Emoji used as the reaction.
                            title: Emoji
                            type: string
                          userIds:
                            description: IDs of users who reacted with this emoji.
                            items:
                              type: string
                            title: Userids
                            type: array
                          createdAt:
                            anyOf:
                              - type: string
                              - type: "null"
                            default: null
                            description: When the reaction was first added.
                            title: Createdat
                        required:
                          - emoji
                          - userIds
                        title: Reaction
                        type: object
                      title: Reactions
                      type: array
                  required:
                    - id
                  title: MessageItem
                  type: object
                title: Messages
                type: array
              mentionedUsers:
                description: Users mentioned by `@[<userId>]` tokens across all messages in the thread, with their resolved name. Aggregated and deduplicated. Users that cannot be resolved are omitted; clients fall back to showing the raw id.
                items:
                  description: |-
                    A user mentioned in a comment thread by an `@[<userId>]` token, with the
                    user's resolved name so the client can render `@<name>` without an extra
                    lookup. The upstream `type` field is dropped - clients don't need to
                    distinguish user types here.
                  properties:
                    id:
                      description: Unique identifier of the user.
                      title: Id
                      type: string
                    name:
                      description: Display name of the user.
                      title: Name
                      type: string
                  required:
                    - id
                    - name
                  title: MentionedUser
                  type: object
                title: Mentionedusers
                type: array
            required:
              - id
            title: CommentItem
            type: object
          title: Data
          type: array
        total:
          description: Total number of comments available.
          title: Total
          type: integer
        offset:
          description: Zero-based index of the first item returned.
          title: Offset
          type: integer
        limit:
          description: Maximum number of items returned.
          title: Limit
          type: integer
        board_id:
          description: ID of the Miro board the comments belong to.
          title: Board Id
          type: string
        board_url:
          description: Canonical Miro board URL; used to build per-comment deep-links.
          title: Board Url
          type: string
      required:
        - data
        - total
        - offset
        - limit
        - board_id
        - board_url
      description: Paginated response for listing comments.
      title: ListCommentsResponse
    annotations:
      title: Read Comments
      readOnlyHint: true
      destructiveHint: false
      openWorldHint: false
