  - name: canvas_search
    title: Search Canvas
    description: Search and navigate board content on top of the canvas-composer SVG representation to find relevant items and areas. Use canvas search beforehand to narrow down scope of a read.
    inputSchema:
      type: object
      properties:
        miro_url:
          description: Full Miro board URL (e.g., 'https://miro.com/app/board/uXjVOakxTk0='). To target a specific parent frame, include ?moveToWidget=<frame_id>.
          type: string
        result_mode:
          enum:
            - overview
            - areas
            - matches
          type: string
          description: Use overview without patterns for container titles and a small sample of board regions. Use areas to rank sections from related signals. Use matches for exact items, occurrences, IDs, attributes, or captures.
        patterns:
          default: null
          description: Required for areas and matches. Omit for overview. Send related patterns together. Values are case-insensitive literal text by default. Prefix structural SVG regex with re:. Prefix literal text with text:. The prefix is consumed, so use text:text:budget to find the literal text:budget.
          items:
            maxLength: 500
            minLength: 1
            type: string
          maxItems: 50
          minItems: 1
          type: array
          nullable: true
        target_id:
          default: null
          description: Limit areas or matches to one result from an earlier search. Omit for overview.
          maxLength: 256
          pattern: ^m?\d+$
          type: string
          nullable: true
        cursor:
          default: null
          description: Continue areas or matches from next_cursor only when the earlier result was truncated. Omit for overview.
          minimum: 0
          type: integer
          nullable: true
        invocation_source:
          default: null
          description: Identifies what triggered this tool call. You must populate this field. Set to 'skill' when this tool call was made because a Miro AI skill instructed it. Set to 'ui' when invoked from the Miro MCP UI. Leave unset otherwise.
          type: string
          nullable: true
        is_repository:
          default: false
          description: Set to true when the folder you are operating in is a source-control repository (for example a Git working directory); set to false otherwise. You must populate this field. Defaults to false.
          type: boolean
      required:
        - miro_url
        - result_mode
      additionalProperties: false
    outputSchema:
      type: object
      properties:
        total_items:
          type: integer
        total_results:
          description: Total available results. For overview, this is the bounded result count.
          type: integer
        item_types:
          anyOf:
            - additionalProperties:
                type: integer
              type: object
            - type: "null"
          default: null
          description: Board-wide item counts returned by overview.
        overview:
          anyOf:
            - properties:
                container_count:
                  description: Total structural containers on the board.
                  type: integer
                loose_content:
                  properties:
                    items:
                      description: Total items outside structural containers.
                      type: integer
                    regions:
                      description: Total spatial groups outside structural containers.
                      type: integer
                    isolated:
                      description: Total isolated items outside structural containers.
                      type: integer
                  required:
                    - items
                    - regions
                    - isolated
                  type: object
                containers:
                  additionalProperties:
                    properties:
                      single:
                        description: Titles that occur once.
                        items:
                          type: string
                        type: array
                      repeated:
                        description: Titles that occur more than once.
                        items:
                          properties:
                            title:
                              description: Exact container title.
                              type: string
                            count:
                              description: Containers with this exact title.
                              minimum: 2
                              type: integer
                          required:
                            - title
                            - count
                          type: object
                        type: array
                    type: object
                  description: Named container titles grouped by type. Counts appear only for duplicates.
                  type: object
                isolated_items:
                  description: Sample items outside containers and spatial regions.
                  items:
                    properties:
                      id:
                        description: Exact item ID for widget_ids or target_id.
                        type: string
                      type:
                        type: string
                      sample:
                        type: string
                      scope:
                        anyOf:
                          - properties:
                              x:
                                description: Left edge.
                                type: integer
                              y:
                                description: Top edge.
                                type: integer
                              width:
                                description: Width.
                                type: integer
                              height:
                                description: Height.
                                type: integer
                            required:
                              - x
                              - y
                              - width
                              - height
                            type: object
                          - type: "null"
                        default: null
                        description: Bounds for a targeted canvas_read_as_svg call.
                    required:
                      - id
                      - type
                      - sample
                    type: object
                  type: array
                containers_truncated:
                  default: false
                  description: Whether the response size limit omitted container titles.
                  type: boolean
              required:
                - container_count
                - loose_content
              type: object
            - type: "null"
          default: null
          description: Board structure returned only by overview.
        results:
          anyOf:
            - items:
                properties:
                  id:
                    description: Exact item ID for widget_ids or target_id.
                    type: string
                  type:
                    type: string
                  parent:
                    anyOf:
                      - type: string
                      - type: "null"
                    default: null
                  scope:
                    anyOf:
                      - properties:
                          x:
                            description: Left edge.
                            type: integer
                          y:
                            description: Top edge.
                            type: integer
                          width:
                            description: Width.
                            type: integer
                          height:
                            description: Height.
                            type: integer
                        required:
                          - x
                          - y
                          - width
                          - height
                        type: object
                      - type: "null"
                    default: null
                    description: Bounds for a targeted canvas_read_as_svg call.
                  matches:
                    additionalProperties:
                      items:
                        type: string
                      type: array
                    type: object
                required:
                  - id
                  - type
                  - matches
                type: object
              type: array
            - items:
                properties:
                  id:
                    description: Area ID for target_id.
                    type: string
                  type:
                    type: string
                  title:
                    anyOf:
                      - type: string
                      - type: "null"
                    default: null
                  matched_patterns:
                    items:
                      type: string
                    type: array
                  evidence:
                    items:
                      type: string
                    type: array
                  match_count:
                    type: integer
                  item_types:
                    additionalProperties:
                      type: integer
                    type: object
                  scope:
                    anyOf:
                      - properties:
                          x:
                            description: Left edge.
                            type: integer
                          y:
                            description: Top edge.
                            type: integer
                          width:
                            description: Width.
                            type: integer
                          height:
                            description: Height.
                            type: integer
                        required:
                          - x
                          - y
                          - width
                          - height
                        type: object
                      - type: "null"
                    default: null
                    description: Bounds for a targeted canvas_read_as_svg call.
                required:
                  - id
                  - type
                  - matched_patterns
                  - evidence
                  - match_count
                  - item_types
                type: object
              type: array
            - items:
                properties:
                  id:
                    anyOf:
                      - type: string
                      - type: "null"
                    default: null
                    description: Container ID for target_id. Omitted for a spatial region.
                  type:
                    type: string
                  title:
                    anyOf:
                      - type: string
                      - type: "null"
                    default: null
                  item_count:
                    type: integer
                  samples:
                    description: Sample item text from this region.
                    items:
                      type: string
                    type: array
                  scope:
                    anyOf:
                      - properties:
                          x:
                            description: Left edge.
                            type: integer
                          y:
                            description: Top edge.
                            type: integer
                          width:
                            description: Width.
                            type: integer
                          height:
                            description: Height.
                            type: integer
                        required:
                          - x
                          - y
                          - width
                          - height
                        type: object
                      - type: "null"
                    default: null
                    description: Bounds for a targeted canvas_read_as_svg call.
                required:
