$schema: https://mcpdesc.org/schema/mcp-description/0.8.0-rc.1.json
mcpdesc: 0.8.0
info:
  name: chained-schema
  version: 1.0.0
protocolVersions:
  - '2026-07-28'
components:
  schemas:
    SearchInput:
      type: object
      properties:
        query:
          type: string
      required: [query]
      additionalProperties: false
    SearchInputAlias:
      $componentRef: '#/components/schemas/SearchInput'
tools:
